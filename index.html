<style>
/* Layout: a dark ink-and-brass desk (the game's UI direction); decisions on panels, the Divan's letters on paper. One deliberate dark look. */

/* controls */
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--brass-dim); border-radius: 4px; padding: 8px 13px; font: 500 .95rem var(--f-ui); cursor: pointer; text-align: left; }

.modal { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--brass-dim); border-radius: 4px; padding: 20px 22px; margin-top: 4vh; box-shadow: 0 18px 60px rgba(0, 0, 0, .55); }

.paper-sheet .spark .ln.ru { stroke: #4f6684; } .paper-sheet .spark .ln.eg { stroke: #a37716; }

  function stabilityBreak(s) {
    var L = stabilityLines(s), by = {}, out = [];
    ACTORS.forEach(function (a) { by[a.id] = 0; });
    L.forEach(function (l) { by[l.a] += l.v; });
    ACTORS.forEach(function (a) { if (a.id === 'yen' && !s.ocak) return; out.push({ n: a.n, v: by[a.id], why: L.filter(function (l) { return l.a === a.id; }) }); });
    var temps = s.temp.map(function (t) { return { n: t.n, v: Math.round(t.v), why: [] }; }).filter(function (t) { return t.v !== 0; });
    var total = P(s).stab; out.forEach(function (o) { total += o.v; }); temps.forEach(function (t) { total += t.v; });
    var raw = Math.round(total); // above 60 half of each further point counts, above 80 a quarter: order is easy to restore and hard to perfect
    var eff = total <= 60 ? total : (total <= 100 ? 60 + (total - 60) * 0.5 : 80 + (total - 100) * 0.25);
    return { total: clamp(Math.round(eff), 0, 100), raw: raw, actors: out, temps: temps };
  }
  function stability(s) { return stabilityBreak(s).total; }

  function unrestBreak(s, r) {
    var L = [{ n: 'Bölgenin kendi hâli', v: UNREST_BASE[r] }], st = stability(s);
    var d = Math.round((50 - st) / 2.5 * (st > 50 && CHR[r] ? 0.5 : 1)); if (d) L.push({ n: 'İstikrar ' + st + (d > 0 ? ' (düzen zayıf)' : (CHR[r] ? ' (düzen sağlam; milliyet fikrini yarı yarıya yatıştırır)' : ' (düzen sağlam)')), v: d });
    var road = Math.round(extSum(s, 'sose', 1.5) + extSum(s, 'teftis', 1)); if (road) L.push({ n: 'Şose ağı ve teftiş heyetleri', v: -road });
    if (P(s).unrest) L.push({ n: 'Zorluk: ' + P(s).n, v: P(s).unrest });
    if (CHR[r]) {
      var nat = Math.round(Math.max(0, s.year - 1820) * 0.5 + Math.max(0, s.year - 1840) * 0.5); if (nat) L.push({ n: 'Milliyet fikri yayılıyor' + (s.year > 1840 ? ' (1848\'in rüzgârı)' : ''), v: nat });
      var t = Math.round(s.tension / 8); if (t && BALKAN[r]) L.push({ n: 'Rus kışkırtması (gerginlik ' + Math.round(s.tension) + ')', v: t });
      if (s.ruProtect) L.push({ n: 'Rus himayesi: Ortodoks tebaa Çar\'a bakıyor', v: 8 });
      if (s.laws.tanzimat) L.push({ n: 'Tanzimat: can ve mal güvencesi', v: -6 });
      if (s.laws.islahat) L.push({ n: 'Islahat: hukuk önünde eşitlik', v: -9 });
    }
    if (MUS[r]) {
      if (s.laws.vergi) L.push({ n: 'Merkezî vergi: eşraf gelirini yitirdi', v: 3 });
      if (s.laws.tanzimat) L.push({ n: 'Tanzimat: beyler ve eşraf ayrıcalık kaybediyor', v: 6 });
      if (s.laws.islahat) L.push({ n: 'Islahat Fermanı\'na tepki', v: 7 });
    }
    if (built(s, 'zaptiye')) L.push({ n: 'Zaptiye teşkilatı', v: -8 });
    if (built(s, 'telgrafhat')) L.push({ n: 'Telgraf: merkez haberi günü gününe alıyor', v: -5 });
    if (s.laws.vilayet && BALKAN[r]) L.push({ n: 'Vilayet Nizamnamesi', v: -8 });
    if (built(s, 'balkanyol') && (r === 'Rumeli' || r === 'Bosna' || r === 'Sirbistan')) L.push({ n: 'Rumeli şoseleri', v: -4 });
    if (built(s, 'arabistan') && (r === 'Suriye' || r === 'Irak' || r === 'Hicaz')) L.push({ n: 'Arabistan Ordusu', v: -5 });
    if (s.relief && s.relief.r === r && s.year <= s.relief.until) L.push({ n: 'Vergi affı (' + s.relief.until + sfx(s.relief.until, 'e') + ' kadar)', v: -15 });
    if (s.nizam >= 40) L.push({ n: 'Güçlü Nizam ordusu caydırıyor', v: -5 });
    if (s.auton[r]) L.push({ n: 'Geniş özerklik tanındı', v: -15 });
    s.spikes.forEach(function (x) { if (x.r === r && Math.round(x.v)) L.push({ n: x.n, v: Math.round(x.v), temp: true }); });
    var tot = 0; L.forEach(function (l) { tot += l.v; });
    return { total: clamp(Math.round(tot), 0, 100), lines: L };
  }

  // ---------- events ----------
  function opt(id, label, eff, fn, disabled) { return { id: id, label: label, eff: eff, fn: fn, disabled: disabled || null }; }
  // a windowed event: whether this game has it, and its year inside the historical window, are drawn once per seed
  function due(s, id, lo, hi, prob) {
    if (s.fired[id]) return false;
    if (prob < 1 && drawK(s, 'has-' + id) >= prob) return false;
    var y0 = lo + Math.floor(drawK(s, 'when-' + id) * (hi - lo + 1));
    return s.year >= y0 && s.year <= hi + 2;
  }
  function variant(s, id) { return drawK(s, 'var-' + id) < 0.5; }
  function egyptOpen(s) { return s.egypt.independent || s.lost.Suriye === 'Mısır' || s.lost.Girit === 'Mısır' || s.lost.Hicaz === 'Mısır'; }
  function genEvents(s) {
    var E = [], y = s.year, st = stability(s), ev = P(s).event;
    if (s.over || s.pause) return E;
    function fire(id) { if (E.length < 3 && E.indexOf(id) < 0) { E.push(id); s.fired[id] = y; return true; } return false; }
    // a war in progress comes first
    if (s.war) {
      if (s.war.stage === 0) { if (!built(s, 'filo')) E.push('sinop'); else chron(s, 'Buharlı filo Karadeniz\'de Rus baskınını boşa çıkardı.'); E.push('war_tuna'); }
      else if (s.war.stage === 1) { if (s.war.gb || s.war.fr) { E.push('war_loan'); E.push('war_kirim'); } else E.push('war_kars'); }
      else E.push('war_peace');
    }
    if (s.era === 2 && !s.fired.london) { E.push(egyptOpen(s) ? 'london' : 'egypt_heir'); s.fired.london = y; }
    // Greek revolt
    if (s.greek === 'none' && y >= 1820 && y <= 1840) {
      var p = ((y === 1821 ? 0.7 : 0.3) + (55 - st) / 100 + (s.greekBoost ? 0.2 : 0)) * ev;
      if (draw(s, 'greek') < p) E.push('greek_start');
    } else if (s.greek === 'active') {
      E.push(y >= 1828 ? 'greek_powers' : 'greek_continue');
    }
    if (s.greek === 'egypt' && !s.navarino && y >= 1827) E.push('navarino');
    if (s.serbia === 'ottoman' && y >= 1817 && y <= 1826 && draw(s, 'serbia') < 0.3 * ev) E.push('serbia');
    var thr = ruThr(s);
    if (s.tension >= thr && !s.war && !s.rwar) E.push('russia_ultimatum');
    if (!s.egyptCrisis && !s.egypt.independent && !s.egypt.settled && y >= 1828) {
      var fe = forecast(s, 'syria', 'egypt');
      if (fe.ratio < 1.25 || s.egypt.loyalty < 35) { if (draw(s, 'egyptcrisis') < 0.6 || y >= 1833) E.push('egypt_crisis'); }
    }
    if (y > START && draw(s, 'harvest') < 0.15 * ev && !(s.famY && y - s.famY < 3)) E.push('harvest'); // no famine within two years of the last, so it does not repeat
    if (s.ocak && s.nizam >= 25 && draw(s, 'janriot') < 0.3 * ev) E.push('jan_unrest');
    if (!s.offers.izmir && y >= 1822 && y <= 1832 && draw(s, 'izmir') < 0.4) E.push('izmir_offer');
    if (s.F >= 40 && !s.bankrupt && draw(s, 'creditors') < 0.4 * ev) E.push('creditors');
    // version 3: the pool. Each needs its condition; the seed decides which a game sees and when.
    if (s.era === 1) {
      if (due(s, 'tepedelen', 1819, 1822, 0.75)) fire('tepedelen');
      if (due(s, 'kolera', 1830, 1836, 0.6 * ev)) fire('kolera');
    } else {
      if (regionOn(s, 'Eflak') && due(s, 'eflak1848', 1848, 1849, 1)) fire('eflak1848');
      if (due(s, 'multeci', 1849, 1850, 0.8)) fire('multeci');
      if (!s.crimea && !s.war && due(s, 'holy', 1852, 1854, 1)) {
        fire('holy'); // the quarrel over the Holy Places is diplomatic: it comes whoever is stronger; strength changes its terms
      }
      if ((s.lean || 0) >= 0.3 && !s.war && !s.rwar && (!s.concY || y - s.concY >= 5) && y >= 1843) { if (E.length < 3) { E.push('concert'); s.concY = y; } }
      if (regionOn(s, 'Bosna') && due(s, 'karadag', 1852, 1858, 0.75 * ev)) fire('karadag');
      if (regionOn(s, 'Hicaz') && due(s, 'hicaz', 1855, 1857, 0.5 * ev)) fire('hicaz');
      if (!s.projects.aydin && due(s, 'rail_offer', 1855, 1858, 0.7)) fire('rail_offer');
      if (regionOn(s, 'Eflak') && !s.auton.Eflak && due(s, 'union', 1857, 1859, 1)) fire('union');
      if (regionOn(s, 'Suriye') && due(s, 'lubnan', 1858, 1860, 0.85)) fire('lubnan');
      if (st < 40 && due(s, 'kuleli', 1857, 1860, 1)) fire('kuleli');
    }
    // a restless province may rise (one a year at most)
    var order = Object.keys(REGIONS);
    for (var i = 0; i < order.length; i++) { var r = order[i]; if (regionOn(s, r) && unrest(s, r) >= 60 && draw(s, 'revolt-' + r) < 0.4 * ev) { if (E.length < 4) E.push('revolt:' + r); break; } }
    return E;
  }

  function intro() {
    var sv = load(), g = sv && sv.s, canResume = !!g && !g.over, old = isOld(sv);
    var where = g ? (g.pause ? '1840 · ilk hüküm' : g.year) + ' · ' + M.DIFF[g.diff].n + (old ? ' · ' + oldVer(sv) + ' kaydı' : '') : '';
    return '<main class="intro"><div class="paper-sheet"><p class="place">İstanbul, 1816</p><h1>Proje 1815</h1><p class="tag">Kâğıt döngü · sürüm ' + M.VERSION + '</p>' +
      '<p>' + gloss('Osmanlı Devleti\'nin başındasın. Hazine boş, ordu Yeniçerilerin elinde, komşular güçleniyor. Her yıl birkaç karar verirsin; 1840\'ta tarih ilk hükmünü verir, istersen 1860\'a kadar sürdürürsün.') + '</p>' +
      (ui.oldFail ? '<p class="note bad">Eski sürüm kaydın 3.2 kurallarıyla kurulamadı ve silindi. Yeni bir oyun başlatabilirsin.</p>' : '') +
      (canResume ? '<div class="actions">' + btn('resume', 'Devam et <small>' + where + '</small>', { cls: 'btn primary big' }) + '</div>' + (old ? '<p class="note">Bu kayıt ' + oldVer(sv) + ' sürümünden. Devam edersen kararların 3.2 kurallarıyla baştan uygulanır; artık geçmeyenler atlanır.</p>' : '') + '<h2>Yeni oyun</h2>' : (g && g.over ? '<div class="actions">' + btn('resume', 'Son oyunun sonucunu aç', { cls: 'btn' }) + '</div>' : '')) +
      '<h3>Zorluk</h3>' + diffPicker() +
      '<div class="actions">' + btn('new', 'Yeni oyun', { arg: canResume ? 'ask' : 'yes', cls: 'btn big' + (canResume ? '' : ' primary') }) + btn('modal', 'Kayıt kodum var', { arg: 'code', cls: 'btn ghost' }) + '</div>' +
      (ui.askNew ? '<p class="note bad">Kayıtlı oyunun silinir. Emin misin? ' + btn('new', 'Evet, yeni oyun başlat', { arg: 'yes', cls: 'btn' }) + '</p>' : '') +
      '<p class="note rec">Oyunun kaydı (kararların, süren, anketin) sonunda Tolga\'ya gönderilir' + (ENDPOINT ? ', her on yılda kendiliğinden de' : '') + '; başka kişisel bilgi alınmaz.</p>' +
      '<p class="note">Telefonda oynamak için yapıldı; 1840\'a kadar 20–30 dakika sürer. Oyun kendiliğinden kaydedilir.</p>' +
      '<p class="note"><b>3.2\'de yeni:</b> hiç bitmeyen, adım adım pahalanan yatırımlar (demiryolu ağı, fabrikalar, mektepler, kale hatları, kolordular); güçlendikçe karşı kefeye ağırlık koyan büyük güçler; yükseldikçe zorlaşan istikrar.</p></div></main>';
  }
  function verdictSheet(v, G) {
    return '<div class="areas">' + G.map(function (g) { return '<div class="area"><span>' + (g.done ? '✓ ' : '') + esc(g.n) + '</span>' + bar(g.v, 1) + '<b>' + Math.round(g.v * 100) + '</b>' + why(g.why) + '</div>'; }).join('') + '</div>' +
      '<p class="note">Tarihin Hükmü tek bir puan vermez; yedi alanı ayrı ayrı tartar (0–100).</p>' +
      '<div class="areas">' + v.areas.map(function (a) { return '<div class="area"><span>' + esc(a.n) + '</span>' + bar(a.v, 100) + '<b>' + a.v + '</b>' + why(a.why) + '</div>'; }).join('') + '</div>' + spark();
  }
  function judgeView() {
    var v = M.verdict(s), G = M.goals(s), n = G.filter(function (g) { return g.done; }).length;
    return '<main class="end"><div class="paper-sheet"><p class="place">1 Ocak 1841 · Tarihin ilk hükmü</p><h1>' + esc(v.title) + '</h1>' +
      '<p>' + gloss('Yirmi beş yıl geçti. Üç hedefin ' + n + ' tanesine ulaştın. II. Mahmud\'un devri kapanıyor; genç Abdülmecid ile yeni bir dönem açılıyor: Tanzimat, telgraf, demiryolu ve Rusya ile büyük hesaplaşma.') + '</p>' + verdictSheet(v, G) +
      '<div class="actions">' + btn('cont', 'Devam et: 1841–1860 <small>yeni hedefler, yeni icatlar, yeni krizler</small>', { cls: 'btn primary big' }) + btn('fin', 'Burada bitir <small>ankete geç</small>', { cls: 'btn ghost' }) + '</div>' +
      '<p class="note">Devam edersen devletin, hazinen ve ordun olduğu gibi yeni döneme geçer.</p></div></main>';
  }
  var RATE = [['fun', 'Oyun eğlenceli miydi?', 'hiç', 'çok'], ['clear', 'Ne yapman gerektiği anlaşılıyor muydu?', 'hiç', 'hep'], ['again', 'Yeniden oynamak ister misin?', 'hayır', 'kesinlikle']];
  function bigDecisions() { // reminders for the three-decisions question: the events and the laws of this game
    var out = s.evlog.map(function (e) { return e[0] + ' · ' + e[5] + ': ' + e[4]; });
    s.decisions.forEach(function (d) { if (/yasasını uyguladın|Ocak'ı kaldır|sefer açtın|kurumunu [34]\. seviyeye|kongreye götürdün|anlaştın|Redif'i silah/.test(d.t)) out.push(d.y + ' · ' + d.t); });
    out.sort(); return out;
  }
  function survey() {
    var sv = rec.survey, big = bigDecisions();
    function rate(r) { return '<div class="rate"><span>' + r[1] + '</span><div class="seg wide five">' + [1, 2, 3, 4, 5].map(function (n) { return '<button class="' + (sv[r[0]] === n ? 'on' : '') + '" data-act="rate" data-arg="' + r[0] + ':' + n + '" aria-label="' + n + ' / 5">' + n + '</button>'; }).join('') + '</div><small>1 = ' + r[2] + ' · 5 = ' + r[3] + '</small></div>'; }
    function ta(k, ph, cls) { return '<textarea class="sv ' + (cls || '') + '" data-sv="' + k + '" placeholder="' + esc(ph) + '">' + esc(sv[k] || '') + '</textarea>'; }
    return '<div class="paper-sheet survey"><h2>Kısa anket</h2><p>İki dakikanı alır; hepsi isteğe bağlı. Tolga oyunu senin cevaplarına göre düzeltecek.</p>' + RATE.map(rate).join('') +
      '<h3>En zorlandığın an neydi?</h3>' + ta('hard', 'Örneğin: Yeniçeriler kazan kaldırınca ne yapacağımı bilemedim') +
      '<h3>Aklında kalan üç karar ve nedeni <small>istersen</small></h3>' +
      (big.length ? '<details class="remind"><summary>Kararlarını hatırla (dokun: sıradaki boş kutuya yazar)</summary><div class="hints">' + big.slice(0, 40).map(function (t, i) { return '<button class="hint" data-act="hint" data-arg="' + i + '">' + esc(t) + '</button>'; }).join('') + '</div></details>' : '') +
      ta('d1', '1. karar ve neden öyle yaptın?', 'short') + ta('d2', '2. karar ve nedeni', 'short') + ta('d3', '3. karar ve nedeni', 'short') +
      '<h3>Oyun 1880\'e kadar sürseydi devam eder miydin?</h3><div class="seg wide">' + ['Evet', 'Belki', 'Hayır'].map(function (x) { return '<button class="' + (sv.c1880 === x ? 'on' : '') + '" data-act="c1880" data-arg="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
      '<h3>Eklemek istediğin</h3>' + ta('note', 'Anlamadığın, sıkıldığın ya da hoşuna giden her şey') +
      '<label class="field">Adın <small>(isteğe bağlı)</small><input class="sv" data-sv="name" type="text" maxlength="30" value="' + esc(sv.name || '') + '" autocomplete="off"></label>' +
      '<div class="actions">' + btn('send', 'Sonucu Tolga\'ya gönder', { cls: 'btn primary big' }) + '</div>' + (ui.sendOpen ? sharePanel() : '') + '</div>';
  }
  function endView() {
    var v = M.verdict(s), G = M.goals(s);
    var reason = s.endReason === 'coup' ? 'İstikrar çöktü: ' + (s.year - 1) + ' yılında saray darbesi.' : (s.endReason === 'time1840' ? '1 Ocak 1841 · oyunu ilk hükümde bitirdin.' : '1 Ocak 1861 · Tarihin Hükmü');
    return '<main class="end"><div class="paper-sheet"><p class="place">' + esc(reason) + '</p><h1>' + esc(v.title) + '</h1>' +
      (s.judge1 ? '<p class="note">1840\'taki ilk hüküm: <b>' + esc(s.judge1.title) + '</b>.</p>' : '') + verdictSheet(v, G) +
      '<p class="seed">Zorluk: ' + M.DIFF[s.diff].n + ' · Tohum: <b>' + esc(s.seed) + '</b> · ' + minutes() + ' dakika · ' + rec.dec.length + ' karar</p>' +
      '<p class="note">Tohum, bu oyunun olaylarını belirleyen sayıdır: her yeni oyunda değişir, olaylar da onunla değişir.</p></div>' + survey() +
      '<div class="actions endact">' + btn('modal', 'Yeni oyun', { arg: 'newgame', cls: 'btn' }) + '</div></main>';
  }

  // ---------- flow ----------
  var DECADES = [1825, 1835, 1850, 1860];
  function sync() {
    if (!s) { ui.view = 'intro'; return; }
    if (s.over) ui.view = 'end'; else if (s.pause) ui.view = 'judge'; else ui.view = M.currentEvent(s) ? 'event' : 'play';
  }
  function startGame() {
    var old = s || (load() || {}).s, oldRec = rec || (load() || {}).rec, m = meta();
    if (old && !old.over && oldRec && oldRec.log && oldRec.log.length) m.restarts = (m.restarts || 0) + 1;
    m.games = (m.games || 0) + 1; setMeta(m);
    var h = /seed=(\d+)/.exec(window.location.hash || ''), seed = h ? h[1] : String(10000 + Math.floor(Math.random() * 90000));
    s = M.newGame(seed, ui.diff); rec = newRec(seed, ui.diff);
    ui = { view: 'play', tab: 'harita', diff: ui.diff, region: null, modal: 'brief', term: null, why: null, tick: Date.now() }; sync();
  }
  function resumeGame() {
    var d = load(); if (!d) { clearSave(); flash('Kayıt bulunamadı.'); return; }
    var note = null;
    if (isOld(d)) { // an older save: its commands replayed under the 3.2 rules
      var yrs = d.rec.yrs || {}, b = rebuild(d.rec.seed, d.rec.diff, d.rec.log, oldVer(d), d.s.evlog, d.rec);
      if (b.err) { clearSave(); s = null; rec = null; ui.oldFail = true; ui.view = 'intro'; return; }
      Object.keys(yrs).forEach(function (y) { if (+y <= s.year && yrs[y] && yrs[y].t) yrRec(y).t = yrs[y].t; });
      note = oldNote(b.info, oldVer(d)); d.tab = 'harita';
    } else { s = d.s; rec = d.rec; }
    rec.survey = rec.survey || {}; rec.yrs = rec.yrs || {}; rec.dec = rec.dec || [];
    ui = { view: 'play', tab: d.tab || 'harita', diff: s.diff, region: null, modal: note ? 'note' : null, note: note, term: null, why: null, tick: Date.now() }; sync();
  }
  function endTheYear() {
    var r = doCmd('end'); if (!r || r.ok === false) return;
    ui.report = { year: r.year, lines: r.report }; ui.decade = DECADES.indexOf(r.year) >= 0; ui.hl = null;
    if (ui.decade || s.over || s.pause) post(s.over ? 'end' : (s.pause ? 'judge1840' : 'decade' + r.year));
    window.scrollTo(0, 0);
  }
  function flash(msg) { var f = document.createElement('div'); f.className = 'toast'; f.setAttribute('role', 'status'); f.textContent = msg; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 2800); }
  function copyFrom(id) {
    var ta = document.getElementById(id); if (!ta) return; var txt = ta.value;
    function fallback() { try { ta.focus(); ta.select(); if (document.execCommand && document.execCommand('copy')) flash('Kopyalandı'); else flash('Metni seçtim; "Kopyala"ya dokun.'); } catch (e) { flash('Metni elle seçip kopyala.'); } }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { flash('Kopyalandı'); }, fallback); else fallback(); } catch (e) { fallback(); }
  }
  var CMD = { tax: 1, trade: 1, borrowD: 0, borrowF: 0, repay: 0, project: 1, rushP: 1, focus: 1, advisor: 1, import: 0, raise: 1, rushI: 1, lower: 1, law: 1, retake: 1, favor: 0, fetva: 0, dip: 1, stab: 1, relief: 1, regain: 1, callup: 0, buy: 1, grant: 1, ext: 1 };
  function act(a, arg) {
    var r, jump = null;
    touch();
    if (a !== 'sug' && a !== 'term' && a !== 'closeterm') ui.hl = null;
    if (a in CMD) {
      r = doCmd(CMD[a] ? a + ':' + arg : a);
      if (r && r.result) ui.result = r.result;
    } else switch (a) {
      case 'term': ui.term = arg; break;
      case 'closeterm': ui.term = null; break;
      case 'why': ui.why = arg; break;
      case 'closewhy': ui.why = null; break;
      case 'modal': ui.modal = arg; ui.codeErr = null; if (arg === 'share') post('send'); break;
      case 'close': ui.modal = null; break;
      case 'diff': ui.diff = arg; break;
      case 'new': if (arg === 'ask') { ui.askNew = true; break; } startGame(); window.scrollTo(0, 0); break;
      case 'resume': resumeGame(); break;
      case 'tab': ui.tab = arg; jump = '.tabs'; break;
      case 'goto': ui.tab = arg; ui.modal = null; jump = ui.why === 'istikrar' && arg === 'reform' ? '#rf-stab' : '.tabs'; ui.why = null; break;
      case 'jump': jump = '#' + arg; break;
      case 'guide': ui.guideOff = arg === 'off'; break;
      case 'sug': var sgn = (ui.adv || [])[+arg]; if (!sgn) break; yrRec(s.year).tp++; ui.tab = sgn.tab; ui.hl = sgn.id; if (sgn.id.indexOf('map:') === 0) ui.region = sgn.id.slice(4); break;
      case 'region': ui.region = arg; var Yr = yrRec(s.year); Yr.sg.forEach(function (x) { if (x === 'map:' + arg && Yr.fo.indexOf(x) < 0) Yr.fo.push(x); }); jump = window.innerWidth < 900 ? '.rinfo' : null; break;
      case 'nizam': doCmd('nizam:' + (s.nizamTarget + (+arg))); break;
      case 'end': endTheYear(); break;
      case 'choose': r = doCmd('ev:' + arg); if (r && r.result) ui.result = r.result; window.scrollTo(0, 0); break;
      case 'next': if (ui.result) ui.result = null; else if (ui.report) ui.report = null; else if (ui.decade) ui.decade = false; window.scrollTo(0, 0); break;
      case 'cont': r = doCmd('cont'); if (r && r.ok !== false) { ui.modal = 'brief'; ui.tab = 'harita'; ui.region = null; window.scrollTo(0, 0); } break;
      case 'fin': doCmd('fin'); post('end'); window.scrollTo(0, 0); break;
      case 'rate': var pr = String(arg).split(':'); rec.survey[pr[0]] = +pr[1]; break;
      case 'c1880': rec.survey.c1880 = arg; break;
      case 'hint': var big = bigDecisions(), tx = big[+arg], slot = ['d1', 'd2', 'd3'].filter(function (k) { return !(rec.survey[k] || '').trim(); })[0]; if (tx && slot) rec.survey[slot] = tx + ' — çünkü '; else if (tx) flash('Üç kutu da dolu.'); break;
      case 'send': ui.sendOpen = true; post('survey'); jump = '.sent'; break;
      case 'copy': copyFrom(arg); return;
      case 'share': try { navigator.share({ title: 'Proje 1815 · oyun kaydı', text: shareText(false) }).catch(function () { }); } catch (e) { flash('Paylaşım açılamadı; "Metni kopyala"yı dene.'); } return;
      case 'importgo': var el = document.getElementById('codein'); ui.codeIn = el ? el.value : ''; var err = importCode(ui.codeIn); if (err) { ui.codeErr = err; break; } ui.codeErr = null; ui.codeIn = ''; ui.modal = ui.note ? 'note' : null; ui.tab = 'harita'; ui.region = null; ui.view = 'play'; sync(); flash('Oyun yüklendi: ' + (s.pause ? '1840, ilk hüküm' : s.year) + '.'); break;
    }
    if (s) sync();
    render(jump);
  }

  // ---------- render ----------
  function render(jump) {
    var y = window.scrollY, html, overlay = ui.result || ui.report || ui.decade;
    if (!s || ui.view === 'intro') html = intro();
    else if (ui.view === 'end' && !overlay) html = endView();
    else if (ui.view === 'judge' && !overlay) html = judgeView();
    else {
      var pane = { harita: tabHarita, butce: tabButce, proje: tabProje, bilim: tabBilim, reform: tabReform, diplomasi: tabDip, ordu: tabOrdu }[ui.tab]();
      html = header() + '<div class="layout"><div class="main">' + guideBox() + tabs() + pane + '</div>' + side() + '</div>' +
        '<footer class="endbar"><span class="hint">' + (s.focus ? 'Araştırma: ' + esc(M.TECHS[s.focus].n) : 'Araştırma konusu seçilmedi: Divan en ucuz konuya geçecek') + ' · Nizam hedefi ' + s.nizamTarget + ' bin</span>' + btn('end', 'Yılı bitir · ' + s.year + ' →', { cls: 'btn primary' }) + '</footer>';
      if (ui.result) html += resultModal();
      else if (ui.report) html += reportModal();
      else if (ui.decade) html += decadeModal();
      else if (ui.view === 'event') html += eventModal();
      if (ui.why) html += whyModal();
    }
    if (ui.modal === 'code') html += codeModal();
    else if (s && ui.modal === 'brief') html += briefModal();
    else if (s && ui.modal === 'menu') html += menuModal();
    else if (s && ui.modal === 'ocak') html += ocakModal();
    else if (s && ui.modal === 'share') html += shareModal();
    else if (s && ui.modal === 'newgame') html += newGameModal();
    else if (s && ui.modal === 'note') html += modal('Eski kayıt 3.2\'de', '<p class="etext" id="oldnote">' + esc(ui.note || '') + '</p><p class="note">Kurallar değişti: bazı kararların sonucu farklı çıkmış, bazıları artık geçmiyor olabilir. Yeni olanlar için menüden brifingi açabilirsin.</p>', btn('close', 'Devam', { cls: 'btn primary' }), 'paper');
    if (ui.term) html += termModal();
    var codeEl = document.getElementById('codein'); if (codeEl && ui.modal === 'code') ui.codeIn = codeEl.value;
    app.innerHTML = html;
    document.documentElement.classList.toggle('has-modal', !!app.querySelector('.scrim'));
    if (ui.modal === 'code' && ui.codeIn) { var c2 = document.getElementById('codein'); if (c2) c2.value = ui.codeIn; }
    var el = null;
    if (ui.hl && !app.querySelector('.scrim')) { try { el = app.querySelector(hlSelector(ui.hl)); } catch (e) { el = null; } if (el) { el = el.closest('.card, .stepper, .tech, .rinfo, .seg') || el; el.classList.add('hl'); } }
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    else if (jump && app.querySelector(jump)) app.querySelector(jump).scrollIntoView({ block: jump === '.tabs' || jump.charAt(0) === '#' ? 'start' : 'nearest' });
    else if (ui.view === ui.lastView) window.scrollTo(0, y);
    ui.lastView = ui.view;
    save();
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'term') { e.preventDefault(); e.stopPropagation(); act('term', b.dataset.arg); return; }
    if (b.disabled) return; e.preventDefault(); act(b.dataset.act, b.dataset.arg);
  });
  app.addEventListener('keydown', function (e) { var t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t.classList && (t.classList.contains('term') || t.classList.contains('rg'))) { e.preventDefault(); act(t.dataset.act, t.dataset.arg); } });
  app.addEventListener('input', function (e) { var t = e.target; if (t.dataset && t.dataset.sv && rec) { rec.survey[t.dataset.sv] = t.value; save(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (ui.why || ui.term || (ui.modal && ui.modal !== 'brief'))) { if (ui.term) ui.term = null; else if (ui.why) ui.why = null; else ui.modal = null; render(); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { touch(); save(); } else ui.tick = Date.now(); });

  render();
  flush();
})();
// ==UI END==

</script>
</body>
</html>
