<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Proje 1815 Kâğıt Döngü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a dark ink-and-brass desk (the game's UI direction); decisions on panels, the Divan's letters on paper. One deliberate dark look. */
:root {
  color-scheme: dark;
  --desk: #15120e; --panel: #1e1a14; --panel2: #29231a; --line: #3b3226;
  --brass: #c09a5b; --brass-dim: #8a7148; --text: #eadfc6; --muted: #ab9b7c;
  --paper: #efe5cc; --paper2: #e6d8b6; --ink: #2b2219; --ink-muted: #6b5a43;
  --good: #8fb276; --bad: #d2705c; --warn: #d9ab52;
  --us: #c25446; --ru: #8ea4bd; --eg: #cfa44a;
  --f-display: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --f-text: "EB Garamond", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { background: var(--desk); color: var(--text); }
body { font: 16px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
#app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; max-width: 1280px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 1.55rem; color: var(--brass); }
h3 { font-size: 1.12rem; color: var(--brass); margin-top: 1.2rem; margin-bottom: .45rem; letter-spacing: .05em; }
h3 small { font-family: var(--f-ui); color: var(--muted); letter-spacing: 0; font-size: .8rem; }
h4 { font-size: 1.08rem; color: var(--text); display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
p { margin: .4rem 0; }
.lead { color: var(--text); max-width: 68ch; }
.note { color: var(--muted); font-size: .92rem; max-width: 70ch; }
.why { display: block; color: var(--muted); font-size: .82rem; line-height: 1.35; }
b { font-weight: 700; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--desk); display: grid; grid-template-columns: auto auto 1fr; gap: 12px 20px; align-items: center; padding: 12px 0 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.mark { font-family: var(--f-display); font-size: 1.45rem; color: var(--brass); letter-spacing: .06em; }
.sub { color: var(--muted); font-size: .8rem; }
.year { display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 0 14px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.year .y { font-family: var(--f-display); font-size: 2.3rem; color: var(--text); font-variant-numeric: tabular-nums; }
.year .ys { color: var(--muted); font-size: .75rem; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.chip { display: grid; grid-template-rows: auto auto auto; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; color: var(--text); font: inherit; cursor: pointer; min-width: 92px; }
.chip:hover { border-color: var(--brass-dim); }
.chip-l { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.chip-v { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.chip-s { font-size: .74rem; color: var(--muted); }
.chip.bad { border-color: var(--bad); } .chip.bad .chip-v { color: var(--bad); }
.chip.warn { border-color: var(--warn); } .chip.warn .chip-v { color: var(--warn); }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; margin-top: 14px; }
.main { min-width: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: 500 .98rem var(--f-ui); padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--brass); border-bottom-color: var(--brass); }
.pane { padding: 16px 0 8px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.row2 > * { min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 13px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card p { font-size: .92rem; margin: 2px 0; }
.card .who, .card .subt { color: var(--muted); font-size: .85rem; }
.card .subt { font-style: italic; font-family: var(--f-text); }
.card.done { border-color: var(--brass-dim); background: var(--panel2); }
.meta { color: var(--muted); font-size: .82rem; margin-top: auto; padding-top: 6px; }
.pill { display: inline-block; font: 500 .74rem var(--f-ui); padding: 1px 8px; border-radius: 999px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }

/* controls */
.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--brass-dim); border-radius: 4px; padding: 8px 13px; font: 500 .95rem var(--f-ui); cursor: pointer; text-align: left; }
.btn small { display: block; color: var(--muted); font-weight: 400; font-size: .8rem; margin-top: 1px; }
.btn:hover:not(:disabled) { border-color: var(--brass); background: #322a1f; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--brass); color: #1b150e; border-color: var(--brass); font-weight: 700; text-align: center; }
.btn.primary:hover:not(:disabled) { background: #d2ad6c; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.sq { width: 44px; height: 44px; text-align: center; font-size: 1.1rem; padding: 0; }
.btn.big { padding: 11px 26px; font-size: 1.05rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.actions.tight { margin-top: 8px; }
.actions .btn { flex: 1 1 240px; }
.actions.tight .btn { flex: 0 0 auto; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--brass-dim); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; color: var(--text); border: 0; border-right: 1px solid var(--line); padding: 7px 14px; font: 500 .92rem var(--f-ui); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--brass); color: #1b150e; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.seg.wide { display: flex; } .seg.wide button { flex: 1; }
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper span { text-align: center; line-height: 1.3; }
.stepper b { font-family: var(--f-display); font-size: 1.8rem; }
.stepper small { color: var(--muted); }

/* tables */
.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
.t td, .t th { padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t th { color: var(--muted); font-weight: 500; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; text-align: left; }
.t tr.grp td { color: var(--text); font-weight: 500; }
.t tr.sub td { color: var(--muted); font-size: .84rem; padding-left: 14px; border-bottom-style: dotted; }
.t tr.sum td { font-weight: 700; border-bottom: 0; }
.t tr.lag td:nth-child(2) { color: var(--bad); }
.t tr.lead td:nth-child(2) { color: var(--good); }
.fcbox { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; overflow-x: auto; }
.fcbox h4 { margin-bottom: 6px; }

/* technology */
.techs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 10px; }
.tcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tcol h3 { margin: 0 0 2px; }
.tech { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; color: var(--text); font: inherit; cursor: pointer; }
.tech:hover:not(:disabled) { border-color: var(--brass-dim); }
.tech.on { border-color: var(--brass); box-shadow: inset 3px 0 0 var(--brass); }
.tech.known { background: var(--panel2); border-color: var(--brass-dim); }
.tech:disabled:not(.known) { opacity: .5; cursor: not-allowed; }
.tech.known:disabled { cursor: default; }
.tn { font-weight: 700; font-size: .95rem; }
.te { font-size: .8rem; color: var(--muted); }
.tm { font-size: .78rem; color: var(--brass); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--brass); }

/* institutions */
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 11px; height: 11px; border: 1px solid var(--brass-dim); transform: rotate(45deg); }
.pips i.on { background: var(--brass); border-color: var(--brass); }
.pips i.pend { background: repeating-linear-gradient(45deg, var(--brass-dim) 0 2px, transparent 2px 4px); }
.odds { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: .8rem; color: var(--muted); background: var(--panel2); padding: 6px 8px; border-radius: 3px; margin-top: 4px; }
.odds b { width: 100%; color: var(--warn); font-size: .9rem; }

/* diplomacy */
.rel { display: grid; gap: 8px; max-width: 520px; margin: 8px 0; }
.rel > div { display: grid; grid-template-columns: 120px 1fr 64px; gap: 10px; align-items: center; font-size: .92rem; }
.rel b { text-align: right; font-variant-numeric: tabular-nums; }
.hbar { position: relative; height: 8px; background: var(--line); border-radius: 4px; overflow: visible; display: block; }
.hbar i { display: block; height: 100%; background: var(--brass); border-radius: 4px; }
.hbar.ru i { background: var(--ru); } .hbar.eg i { background: var(--eg); }
.hbar b { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--bad); }

/* side */
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.fark, .kronik { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.fark h2, .kronik h2 { font-size: 1.25rem; margin-bottom: 8px; }
.vs { margin-bottom: 12px; }
.vs-h { display: flex; justify-content: space-between; gap: 6px; align-items: center; font-size: .9rem; margin-bottom: 4px; }
.vs-bar { height: 10px; border-radius: 5px; overflow: hidden; background: var(--ru); }
.vs-bar.eg { background: var(--eg); }
.vs-bar i { display: block; height: 100%; background: var(--us); }
.vs-n { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.gap { font-size: .86rem; color: var(--muted); margin: 6px 0 0; }
.kronik ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--f-text); font-size: .98rem; }
.kronik li b { color: var(--brass); font-family: var(--f-ui); font-size: .8rem; margin-right: 4px; }

/* bottom bar */
.endbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 12px; align-items: center; justify-content: flex-end; background: color-mix(in srgb, var(--desk) 92%, transparent); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); backdrop-filter: blur(4px); }
.endbar .hint { color: var(--muted); font-size: .85rem; margin-right: auto; }
.endbar .hint b { color: var(--warn); }
.endbar .btn { padding: 10px 22px; }

/* modals and paper */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 6, 4, .72); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
.modal { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--brass-dim); border-radius: 4px; padding: 20px 22px; margin-top: 4vh; box-shadow: 0 18px 60px rgba(0, 0, 0, .55); }
.modal > h2 { margin-bottom: 8px; }
.mfoot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 16px; }
.modal.paper, .paper-sheet { background: var(--paper); color: var(--ink); border-color: #b9a47a; }
.modal.paper h2, .paper-sheet h1, .paper-sheet h2 { color: #5a2c1e; }
.modal.paper .note, .paper-sheet .note, .modal.paper .why, .paper-sheet .why { color: var(--ink-muted); }
.modal.paper .t td, .paper-sheet .t td, .modal.paper .t th { border-bottom-color: #cdbb94; }
.modal.paper .t tr.lag td:nth-child(2) { color: #a03a26; } .modal.paper .t tr.lead td:nth-child(2) { color: #3f6b2a; }
.modal.paper .fcbox { background: var(--paper2); border-color: #cdbb94; }
.modal.paper .pill { background: #f6eedb; border-color: #cdbb94; color: var(--ink-muted); }
.modal.paper .pill.good { color: #3f6b2a; } .modal.paper .pill.warn { color: #8a5d12; } .modal.paper .pill.bad { color: #a03a26; }
.modal.paper.good { box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 60%, transparent), 0 18px 60px rgba(0,0,0,.55); }
.modal.paper.bad { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 60%, transparent), 0 18px 60px rgba(0,0,0,.55); }
.place { font-family: var(--f-text); font-style: italic; color: var(--ink-muted); margin: 0 0 4px; }
.etext { font-family: var(--f-text); font-size: 1.15rem; line-height: 1.5; }
.opts { display: grid; gap: 8px; margin-top: 14px; }
.opt { text-align: left; background: #f8f1df; border: 1px solid #bfa979; border-radius: 4px; padding: 10px 12px; cursor: pointer; color: var(--ink); font: inherit; display: flex; flex-direction: column; gap: 2px; }
.opt b { font-family: var(--f-display); font-size: 1.12rem; color: #5a2c1e; }
.opt span { font-size: .9rem; color: var(--ink-muted); }
.opt:hover:not(:disabled) { border-color: #5a2c1e; background: #fff8e8; }
.opt:disabled { opacity: .5; cursor: not-allowed; }
.modal.paper .btn.primary { background: #5a2c1e; border-color: #5a2c1e; color: var(--paper); }
.outcome { font-family: var(--f-text); font-size: 1.15rem; }
.outcome.good { color: #3f6b2a; } .outcome.bad { color: #a03a26; }
.rep { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.rep li { padding-left: 14px; position: relative; font-size: .96rem; }
.rep li::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; background: var(--brass-dim); transform: rotate(45deg); }
.rep li.good::before { background: var(--good); } .rep li.bad::before { background: var(--bad); } .rep li.rival::before { background: var(--eg); }
.rep li.bad { color: #f0b7a8; } .rep li.rival { color: var(--muted); font-style: italic; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 8px 16px; border-radius: 4px; z-index: 40; box-shadow: 0 6px 24px rgba(0,0,0,.5); font-size: .92rem; max-width: calc(100% - 32px); }

/* intro and end */
.intro, .end { display: grid; gap: 18px; padding-top: 4vh; max-width: 820px; margin: 0 auto; }
.paper-sheet { border: 1px solid #b9a47a; border-radius: 4px; padding: 26px 28px; font-family: var(--f-text); font-size: 1.12rem; line-height: 1.55; box-shadow: 0 18px 60px rgba(0,0,0,.5); }
.paper-sheet h1 { font-size: clamp(2rem, 6vw, 2.8rem); margin-bottom: 8px; }
.paper-sheet h2 { font-size: 1.5rem; margin-top: 14px; }
.paper-sheet .note { font-family: var(--f-ui); font-size: .92rem; }
.brief { padding-left: 1.1em; } .brief li { margin: 6px 0; }
.field { display: grid; gap: 4px; font-family: var(--f-ui); font-size: .9rem; color: var(--ink-muted); margin: 14px 0 6px; max-width: 320px; }
.field input, textarea { font: 1rem var(--f-ui); padding: 8px 10px; border: 1px solid #b9a47a; border-radius: 4px; background: #fbf6ea; color: var(--ink); width: 100%; box-sizing: border-box; }
textarea { min-height: 64px; margin-top: 8px; resize: vertical; }
.paper-sheet .btn.primary { background: #5a2c1e; border-color: #5a2c1e; color: var(--paper); }
.paper-sheet .btn { background: #f6eedb; color: var(--ink); border-color: #b9a47a; }
.paper-sheet .btn.primary { background: #5a2c1e; color: var(--paper); }
.paper-sheet .seg { border-color: #b9a47a; } .paper-sheet .seg button { color: var(--ink); border-right-color: #cdbb94; } .paper-sheet .seg button.on { background: #5a2c1e; color: var(--paper); }
.areas { display: grid; gap: 8px; margin: 12px 0; font-family: var(--f-ui); }
.area { display: grid; grid-template-columns: 140px 1fr 36px; gap: 10px; align-items: center; font-size: .95rem; }
.area .why { grid-column: 1 / -1; margin-top: -4px; }
.area b { text-align: right; font-variant-numeric: tabular-nums; }
.paper-sheet .hbar { background: #d6c59c; } .paper-sheet .hbar i { background: #5a2c1e; }
.decs { display: grid; gap: 6px; margin-top: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
.dec { display: flex; gap: 10px; align-items: flex-start; font-family: var(--f-ui); font-size: .95rem; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.dec:hover { background: #f6eedb; } .dec.on { background: #f6eedb; outline: 1px solid #b9a47a; }
.dec b { color: #5a2c1e; margin-right: 4px; }
.dec input { margin-top: 4px; accent-color: #5a2c1e; }
.reason { margin: -2px 0 8px 30px; width: calc(100% - 30px); }
.count { font-family: var(--f-ui); font-size: .9rem; color: var(--ink-muted); }
.sent { margin-top: 14px; padding: 12px; background: var(--paper2); border-radius: 4px; font-family: var(--f-ui); font-size: .95rem; }
.sent textarea { min-height: 160px; font-size: .85rem; }
.spark { margin: 12px 0 4px; }
.spark svg { width: 100%; height: auto; display: block; }
.spark .gl { stroke: currentColor; opacity: .18; stroke-width: 1; }
.spark .gt { fill: currentColor; opacity: .65; font: 11px var(--f-ui); }
.spark .ln { fill: none; stroke-width: 2.2; }
.spark .ln.us { stroke: var(--us); } .spark .ln.us2 { stroke: var(--us); stroke-dasharray: 5 4; } .spark .ln.ru { stroke: var(--ru); } .spark .ln.eg { stroke: var(--eg); }
.paper-sheet .spark .ln.ru { stroke: #4f6684; } .paper-sheet .spark .ln.eg { stroke: #a37716; }
.spark figcaption { font-size: .8rem; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-family: var(--f-ui); opacity: .85; }
.k { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 4px; }
.k.us { background: var(--us); } .k.us2 { background: repeating-linear-gradient(90deg, var(--us) 0 5px, transparent 5px 8px); } .k.ru { background: var(--ru); } .k.eg { background: var(--eg); }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .top { grid-template-columns: auto auto; }
  .chips { grid-column: 1 / -1; justify-content: flex-start; }
  .top { position: static; }
}
@media (max-width: 560px) {
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .chip { min-width: 0; flex: 1 1 30%; padding: 4px 8px; }
  .chip-v { font-size: 1.15rem; }
  .paper-sheet { padding: 18px 16px; font-size: 1.04rem; }
  .modal { padding: 16px 14px; }
  .rel > div { grid-template-columns: 96px 1fr 56px; }
  .area { grid-template-columns: 110px 1fr 32px; }
  .endbar .hint { display: none; }
  .endbar .btn { flex: 1; }
}
@media (prefers-reduced-motion: no-preference) { .modal { animation: rise .22s ease-out; } @keyframes rise { from { transform: translateY(8px); } to { transform: none; } } }

/* v2: before and after, goals, the path, glossary */
.up { color: var(--good); } .down { color: var(--bad); }

      L.push({ n: 'Feshane', v: f, why: (knows(s, 'dokuma') ? 'Mekanik dokuma +%50; ' : '') + ((s.trade === 'free' || s.treaty) ? 'ucuz ithal kumaş −%40' : 'korunan iç pazar') });
    }
    if (built(s, 'sose')) L.push({ n: 'Şose ticareti', v: 2, why: 'İstanbul–Edirne şosesi' });
    if (s.concessions.indexOf('izmir') >= 0) L.push({ n: 'İzmir limanı', v: 3.6, why: '6 gelir; %40 İngiliz şirketinin' });
    if (!s.egypt.independent && s.egypt.loyalty >= 30 && s.egypt.tribute > 0) L.push({ n: 'Mısır haracı', v: s.egypt.tribute, why: 'Mehmed Ali sadık (bağlılık ' + Math.round(s.egypt.loyalty) + ')' });
    if (s.bankrupt) { var cut = -0.5 * (cust + ind); L.push({ n: 'Alacaklılar idaresi', v: cut, why: 'İflas: gümrük ve dolaylı vergilerin yarısı alacaklılara' }); }
    var tot = 0; L.forEach(function (l) { tot += l.v; });
    return { total: tot, lines: L };
  }
  function nizamCost(s) { return s.laws.redif ? 0.38 : 0.5; }
  function foreignRate(s) {
    var st = stability(s);
    return Math.max(4, 5 + Math.max(0, (55 - st) / 10) + (s.F > 40 ? 1 : 0) - (s.laws.tanzimat ? 1 : 0) + s.rateExtra);
  }
  function expenseBreak(s) {
    var L = [];
    if (s.ocak) L.push({ n: 'Yeniçeri ulufesi', v: s.jan * 0.45, why: s.jan + ' bin Yeniçeri' });
    if (s.nizam > 0) L.push({ n: 'Nizam ordusu', v: s.nizam * nizamCost(s), why: s.nizam + ' bin asker' + (s.laws.redif ? ' (Redif ile ucuz)' : '') });
    L.push({ n: 'Donanma', v: 6, why: 'Kalyon filosu' });
    L.push({ n: 'İdare', v: 14, why: 'Vilayet ve kalem' });
    L.push({ n: 'Saray', v: 10, why: 'Saray ve hanedan' });
    var iu = 0, why = [];
    for (var k in INST) { var lv = s.inst[k].lvl; var p = s.inst[k].pend; var l2 = p ? p.to : lv; if (INST[k].up[l2] > 0) { iu += INST[k].up[l2]; why.push(INST[k].n + ' ' + l2); } }
    if (iu > 0) L.push({ n: 'Kurumların bakımı', v: iu, why: why.join(', ') });
    var pu = 0, pw = [];
    for (var p2 in s.projects) if (s.projects[p2] === 'done') { pu += PROJ[p2].up; pw.push(PROJ[p2].n); }
    if (pu > 0) L.push({ n: 'Yapıların bakımı', v: pu, why: pw.join(', ') });
    if (s.adv.fr) L.push({ n: 'Fransız subay heyeti', v: 5, why: 'Maaşlar' });
    if (s.adv.gb) L.push({ n: 'İngiliz mühendisler', v: 6, why: 'Lisans ve maaşlar' });
    var intr = s.D * 0.08 + s.F * foreignRate(s) / 100;
    if (intr > 0) L.push({ n: 'Faiz', v: intr, why: (s.D > 0 ? 'iç borç ' + Math.round(s.D) + ' (faiz %8)' : '') + (s.D > 0 && s.F > 0 ? '; ' : '') + (s.F > 0 ? 'dış borç ' + Math.round(s.F) + ' (faiz %' + String(r1(foreignRate(s))).replace('.', ',') + ')' : '') });
    var tot = 0; L.forEach(function (l) { tot += l.v; });
    return { total: tot, lines: L };
  }
  function rpGainBreak(s) {
    var st = stability(s), L = [{ n: 'Taban', v: 2 }];
    var b = Math.max(0, Math.floor((st - 40) / 10)); if (b) L.push({ n: 'İstikrar ' + st, v: b });
    var kal = stabilityLines(s).filter(function (l) { return l.a === 'kal'; }).reduce(function (a, l) { return a + l.v; }, 0);
    if (kal >= 6) L.push({ n: 'Güçlü Kalemiye', v: 1 });
    var tot = 0; L.forEach(function (l) { tot += l.v; }); return { total: tot, lines: L };
  }
  function researchBreak(s) {
    var L = [{ n: 'Taban (medrese ve tercüme odası)', v: 2 }];

  }
  function dependenceBreak(s) {
    var L = [];
    if (s.imported > 0) L.push({ n: 'Silahta dış tedarik', v: Math.min(25, Math.round(25 * s.imported / Math.max(1, s.rifles))) });
    if (s.F > 0) L.push({ n: 'Dış borç', v: Math.min(30, Math.round(s.F * 0.5)) });

  }

  // ---------- war ----------
  var FRONTS = {
    balkan: { n: 'Balkan cephesi', share: 0.7, supply: 0.95, fort: 1.2 },
    syria: { n: 'Suriye cephesi', share: 0.5, supply: 0.8, fort: 1.0 },
    mora: { n: 'Mora', share: 0.5, supply: 0.75, fort: 1.0 }
  };
  function ourSide(s, front) {
    var F = FRONTS[front], janE = s.ocak ? s.jan * 0.7 : 0, tot = s.nizam + janE;
    var men = tot * F.share; if (front === 'mora') men = Math.min(men, 45);
    var w = tot > 0 ? s.nizam / tot : 0, ae = instEff(s, 'ae');
    var rr = s.nizam > 0 ? Math.min(1, s.rifles / s.nizam) : 0;
    var neq = 0.8 + 0.3 * rr + (knows(s, 'kapsul') && built(s, 'tufekhane') ? 0.12 : 0);
    var equip = w * neq + (1 - w) * 0.78 + (built(s, 'tophane') ? 0.08 : 0) + (built(s, 'baruthane') ? 0.05 : 0);
    var eqWhy = [];
    if (s.nizam > 0) eqWhy.push('tüfek stoku ' + Math.round(s.rifles) + ' bin / Nizam ' + s.nizam + ' bin' + (built(s, 'tufekhane') ? ' (İzmir Tüfekhanesi)' : '') + (s.imported > 0 ? ' (ithal tüfek dahil)' : ''));
    if (knows(s, 'kapsul') && built(s, 'tufekhane')) eqWhy.push('kapsüllü tüfek');
    if (built(s, 'tophane')) eqWhy.push('Tophane ıslahı');
    if (built(s, 'baruthane')) eqWhy.push('Azadlı Baruthanesi');
    if (s.ocak) eqWhy.push('Yeniçerilerin eski çakmaklıları');
    var train = w * (0.85 + 0.14 * ae) + (1 - w) * 0.72;
    var trWhy = [];
    if (s.nizam > 0) trWhy.push('Askerî eğitim ' + ae + '. seviye');
    if (s.ocak) trWhy.push('Yeniçeriler talimsiz (' + Math.round(janE) + ' bin fiilî)');
    var cmd = 0.85 + 0.06 * ae + (built(s, 'harbiye') ? 0.12 : 0) + (s.adv.fr ? 0.06 : 0);
    var cmWhy = []; if (ae) cmWhy.push('Askerî eğitim ' + ae); if (built(s, 'harbiye')) cmWhy.push('Mekteb-i Harbiye'); if (s.adv.fr) cmWhy.push('Fransız subaylar');
    var sup = F.supply, spWhy = [];
    if (front === 'balkan' && built(s, 'sose')) { sup += 0.12; spWhy.push('İstanbul–Edirne şosesi'); }
    if ((front === 'mora' || front === 'syria') && built(s, 'tersane')) { sup += 0.15; spWhy.push('Buharlı tersane'); }
    if (front === 'syria' && s.concessions.indexOf('izmir') >= 0) { sup += 0.05; spWhy.push('İzmir limanı'); }
    if (!spWhy.length) spWhy.push(front === 'balkan' ? 'eski yollar' : 'uzun kara yolu');
    var wear = s.temp.filter(function (t) { return t.id === 'wear'; }).reduce(function (a, t) { return a + t.v; }, 0);
    var mor = 0.75 + stability(s) / 200 + wear / 100;
    var mrWhy = ['istikrar ' + stability(s)]; if (wear) mrWhy.push('savaş yorgunluğu');
    var ter = F.fort, tWhy = [front === 'balkan' ? 'Tuna kaleleri (Şumnu, Silistre)' : 'açık arazi'];
    return { men: men, f: [
      { k: 'Teçhizat', v: equip, why: eqWhy.join('; ') },
      { k: 'Eğitim', v: train, why: trWhy.join('; ') },
      { k: 'Komuta', v: cmd, why: cmWhy.join('; ') || 'eski usul ağalar' },
      { k: 'İkmal', v: sup, why: spWhy.join('; ') },
      { k: 'Moral', v: mor, why: mrWhy.join('; ') },
      { k: 'Arazi ve tahkimat', v: ter, why: tWhy.join('; ') }
    ] };
  }
  function enemySide(s, who) {
    if (who === 'russia') {
      var R = s.russia;
      return { n: 'Rus ordusu', men: R.men, f: [
        { k: 'Teçhizat', v: R.equip, why: 'Tula fabrikaları' }, { k: 'Eğitim', v: R.train, why: 'Napolyon savaşları gazileri' },
        { k: 'Komuta', v: R.cmd, why: 'kurmay heyeti' }, { k: 'İkmal', v: 0.9, why: 'Tuna ötesi uzun hat' },
        { k: 'Moral', v: 1.0, why: '' }, { k: 'Arazi ve tahkimat', v: 1.0, why: 'saldıran taraf' }] };
    }
    if (who === 'egypt') {
      var E = s.egypt;
      return { n: 'Mısır ordusu', men: E.men * 0.6, f: [
        { k: 'Teçhizat', v: E.equip, why: 'Mısır fabrikaları' }, { k: 'Eğitim', v: E.train, why: 'Fransız eğitmenler (Sève)' },
        { k: 'Komuta', v: E.cmd, why: 'İbrahim Paşa' }, { k: 'İkmal', v: 0.95, why: 'deniz ve Suriye yolları' },
        { k: 'Moral', v: 1.05, why: 'zaferler' }, { k: 'Arazi ve tahkimat', v: 1.0, why: 'saldıran taraf' }] };
    }
    var y = s.greekYears;
    return { n: 'Mora isyancıları', men: 18 + 2 * y, f: [
      { k: 'Teçhizat', v: 0.8, why: 'eski tüfekler, gönüllü silahları' }, { k: 'Eğitim', v: 0.65, why: 'düzensiz kuvvet' },
      { k: 'Komuta', v: 0.8, why: 'kaptanlar' }, { k: 'İkmal', v: 0.9, why: 'yerel halk' },
      { k: 'Moral', v: 1.15, why: 'bağımsızlık' }, { k: 'Arazi ve tahkimat', v: 1.25, why: 'dağlar' }] };
  }
  function power(side) { var q = 1; side.f.forEach(function (x) { q *= x.v; }); q = clamp(q, 0.3, 2.6); return { q: q, p: side.men * q }; }
  function forecast(s, front, who) {
    var a = ourSide(s, front), b = enemySide(s, who), pa = power(a), pb = power(b);
    var ratio = pb.p > 0 ? pa.p / pb.p : 9, k = Math.pow(ratio, 2.5), win = k / (1 + k);
    var weakest = null, wv = 99;
    a.f.forEach(function (x, i) { var d = x.v / b.f[i].v; if (d < wv) { wv = d; weakest = x.k; } });
    var lvl = win >= 0.65 ? 'Yüksek' : (win >= 0.4 ? 'Orta' : 'Düşük');
    return { us: a, them: b, pa: pa, pb: pb, ratio: ratio, win: win, lo: clamp(win - 0.08, 0.02, 0.98), hi: clamp(win + 0.08, 0.02, 0.98), level: lvl, weakest: weakest };
  }
  function battle(s, front, who, purpose) {
    var fc = forecast(s, front, who), d = draw(s, 'battle-' + purpose);
    var won = d < fc.win;
    var lossUs = Math.round(fc.us.men * (won ? 0.12 : 0.3) * 1000 / 100) * 100;
    var lossThem = Math.round(fc.them.men * (won ? 0.3 : 0.12) * 1000 / 100) * 100;
    s.rifles = Math.max(0, s.rifles * 0.75);
    addTemp(s, 'wear', 'Savaş yorgunluğu', -6, 0.5);
    return { won: won, fc: fc, lossUs: lossUs, lossThem: lossThem };
  }

  // ---------- helpers ----------
  function addTemp(s, id, n, v, decay) { s.temp.push({ id: id, n: n, v: v, decay: decay || 0.4 }); }
  function decide(s, t) { s.decisions.push({ y: s.year, t: t }); }
  function chron(s, t) { s.chron.push({ y: s.year, t: t }); }
  function loseRegion(s, r, who) { if (!s.lost[r]) { s.lost[r] = who; } }

  // ---------- actions (the six verbs) ----------
  function canAfford(s, c) { return s.treasury >= c; }
  var A = {};
  A.setTax = function (s, t) { if (s.tax === t) return; s.tax = t; decide(s, 'Vergi düzeyini "' + ['Düşük', 'Olağan', 'Yüksek'][t] + '" yaptın'); };
  A.setTrade = function (s, t) { if (s.treaty || s.trade === t) return; s.trade = t; decide(s, t === 'free' ? 'Serbest ticarete geçtin' : 'Korumacılığa döndün'); };
  A.borrowD = function (s) { var c = Math.floor(Math.min(15, 40 - s.D)); if (c <= 0) return { ok: false, why: 'İç borç tavanı (40 milyon kuruş) dolu' }; s.D += c; s.treasury += c; decide(s, 'Galata bankerlerinden ' + c + ' milyon kuruş borç aldın'); return { ok: true }; };
  A.borrowFCheck = function (s) { if (s.bankrupt) return 'İflastan sonra dış borç verilmiyor'; if (Math.max(s.rel.GB, s.rel.FR) < 40) return 'Londra ve Paris ilişkileri 40\'ın altında'; if (s.F >= 90) return 'Dış borç tavanı'; return null; };
  A.borrowF = function (s) { var w = A.borrowFCheck(s); if (w) return { ok: false, why: w }; s.F += 30; s.treasury += 30; decide(s, "Londra'dan 30 milyon kuruş dış borç aldın (faiz %" + String(r1(foreignRate(s))).replace('.', ',') + ')'); return { ok: true }; };
  A.repay = function (s) { if (s.treasury < 10) return { ok: false, why: 'Hazinede 10 milyon kuruş yok' }; if (s.D + s.F <= 0) return { ok: false, why: 'Borç yok' }; var c = Math.min(10, s.F > 0 ? s.F : s.D); if (s.F > 0) s.F -= c; else s.D -= c; s.treasury -= c; decide(s, tr(c) + ' milyon kuruş borç ödedin'); return { ok: true }; };
  A.projectCheck = function (s, id) {
    var P = PROJ[id]; if (s.projects[id]) return s.projects[id] === 'done' ? 'Tamamlandı' : 'Yapılıyor';
    if (P.reqInst && s.inst[P.reqInst[0]].lvl < P.reqInst[1]) return INST[P.reqInst[0]].n + ' ' + P.reqInst[1] + '. seviye gerekli';
    if (P.reqTech && !knows(s, P.reqTech)) return TECHS[P.reqTech].n + ' bilinmeli';
    if (building(s) >= capacity(s)) return 'İnşaat kapasitesi dolu (' + capacity(s) + ')';
    if (!canAfford(s, P.cost)) return 'Hazine yetmiyor (' + P.cost + ' milyon kuruş)';
    return null;
  };
  A.project = function (s, id) { var w = A.projectCheck(s, id); if (w) return { ok: false, why: w }; var P = PROJ[id]; s.treasury -= P.cost; s.projects[id] = { yrs: P.yrs }; decide(s, P.n + ' inşaatını başlattın'); return { ok: true }; };
  A.instCheck = function (s, id) {
    var I = INST[id], st = s.inst[id]; if (st.pend) return 'Yeni seviye oturuyor (' + st.pend.yrs + ' yıl)';
    var to = st.lvl + 1; if (to > 3) return 'En üst seviye';
    if (id === 'ae' && s.ocak && to > 1) return "Ocak varken en fazla 1. seviye (Yeniçeri kilidi)";
    if (I.req[to] && !knows(s, I.req[to])) return TECHS[I.req[to]].n + ' bilinmeli';
    if (s.rp < I.rp[to]) return 'Reform gücü yetmiyor (' + I.rp[to] + ')';
    return null;
  };
  A.raise = function (s, id) { var w = A.instCheck(s, id); if (w) return { ok: false, why: w }; var I = INST[id], st = s.inst[id], to = st.lvl + 1; s.rp -= I.rp[to]; st.pend = { to: to, yrs: 2 }; decide(s, I.n + ' kurumunu ' + to + '. seviyeye yükselttin'); return { ok: true }; };
  A.lower = function (s, id) { var st = s.inst[id]; if (st.pend || st.lvl === 0) return { ok: false, why: 'Düşürülemez' }; st.lvl -= 1; decide(s, INST[id].n + ' kurumunu ' + st.lvl + '. seviyeye düşürdün'); return { ok: true }; };
  A.ocakChance = function (s) {
    var L = [{ n: 'Taban', v: 0.15 }];
    L.push({ n: 'Nizam askeri ' + s.nizam + ' bin', v: 0.55 * s.nizam / (s.nizam + 30) });
    var st = stability(s); L.push({ n: 'İstikrar ' + st, v: (st - 50) / 150 });
    var ule = stabilityLines(s).filter(function (l) { return l.a === 'ule'; }).reduce(function (a, l) { return a + l.v; }, 0);
    L.push(ule >= -4 ? { n: 'Ulema yanında (' + ule + ')', v: 0.08 } : { n: 'Ulema küskün (' + ule + ')', v: -0.05 });
    if (s.adv.fr) L.push({ n: 'Fransız subaylar', v: 0.05 });
    var p = 0; L.forEach(function (l) { p += l.v; }); return { p: clamp(p, 0.05, 0.92), lines: L };
  };
  A.lawCheck = function (s, id) {
    var Lw = LAWS[id]; if (s.laws[id]) return 'Uygulandı';
    if (id === 'ocak') {
      if (!s.ocak) return 'Ocak kaldırıldı';
      if (s.year < s.ocakRetry) return s.ocakRetry + sfx(s.ocakRetry, 'den') + " önce yeniden denenemez";
      if (s.inst.ae.lvl < 1) return 'Askerî eğitim en az 1. seviye olmalı';
      if (s.nizam < 15) return 'En az 15 bin Nizam askeri gerekli';
    } else {
      if (Lw.req && !knows(s, Lw.req)) return TECHS[Lw.req].n + ' bilinmeli';
      if (id === 'redif' && s.ocak) return "Önce Ocak kaldırılmalı";
      if (id === 'tanzimat' && s.inst.mt.lvl < 1) return 'Maarif en az 1. seviye olmalı';
    }
    if (s.rp < Lw.rp) return 'Reform gücü yetmiyor (' + Lw.rp + ')';
    return null;
  };
  A.law = function (s, id) {
    var w = A.lawCheck(s, id); if (w) return { ok: false, why: w }; var Lw = LAWS[id]; s.rp -= Lw.rp;
    if (id === 'ocak') {
      if (s._preview) { s.rp += Lw.rp; return { ok: false, why: 'preview' }; }
      var ch = A.ocakChance(s), d = draw(s, 'ocak');
      if (d < ch.p) {
        s.ocak = false; s.jan = 0; s.rp += 3; addTemp(s, 'ocak', 'Vaka-i Hayriye: Ulema tedirgin', -4, 0.4);
        s.tension = Math.min(100, s.tension + 8);
        decide(s, "Ocak'ı kaldırmaya karar verdin (başarı ihtimali %" + Math.round(ch.p * 100) + ') ve başardın');
        chron(s, "Ocak kaldırıldı. Yeniçeri gideri bitti; askerî eğitim kilidi açıldı. Rusya ordunun zayıf anını kolluyor.");
        return { ok: true, result: { title: 'Vaka-i Hayriye', good: true, text: "Sadık topçular ve Nizam kışlası hazırdı; Ocak bir günde dağıtıldı. Yeniçerilerin yıllık 27'lik ulufesi bitti, ama 42 bin kişilik kuvvet de artık yok. Askerî eğitim 3. seviyeye kadar açık. Rusya bu boşluğu kolluyor (gerginlik +8)." } };
      }
      s.nizam = Math.round(s.nizam * 0.4); s.nizamTarget = Math.min(s.nizamTarget, s.nizam); s.inst.ae.lvl = 0; s.inst.ae.pend = null; s.rp = 0; s.ocakRetry = s.year + 4;
      addTemp(s, 'revolt', 'Yeniçeri isyanı', -18, 0.35);
      decide(s, "Ocak'ı kaldırmayı denedin (başarı ihtimali %" + Math.round(ch.p * 100) + ') ve isyan çıktı');
      chron(s, 'Yeniçeri isyanı: Nizam kışlası yakıldı, askerî eğitim sıfırlandı.');
      return { ok: true, result: { title: 'Yeniçeri isyanı', good: false, text: "Kazanlar devrildi. Nizam askerinin çoğu dağıldı (" + s.nizam + " bin kaldı), Askerî eğitim sıfırlandı, reform gücü tükendi. Ocak meselesi " + s.ocakRetry + sfx(s.ocakRetry, 'e') + " kadar yeniden açılamaz." } };
    }
    s.laws[id] = { year: s.year, wait: Lw.delay || 0 };
    if (id === 'tanzimat') { s.rel.GB = Math.min(100, s.rel.GB + 15); s.rel.FR = Math.min(100, s.rel.FR + 15); addTemp(s, 'tanz', 'Tanzimat sarsıntısı', -6, 0.6); }
    decide(s, Lw.n + ' yasasını uyguladın');
    chron(s, Lw.n + ' ilan edildi.');

    var h = s.history, now = h[h.length - 1], first = h[0];
    function row(n, a, b, d) { return '<tr><td>' + n + '</td><td class="num">' + a + '</td><td class="num">' + b + '</td>' + (d != null ? '<td class="num">' + d + '</td>' : '<td></td>') + '</tr>'; }
    var body = '<p class="lead">On yıl raporu: 1816\'dan bugüne. Rakipler de her yıl yatırım yaptı.</p><table class="t"><thead><tr><th></th><th class="num">1816</th><th class="num">' + now.y + '</th><th class="num">Rakip</th></tr></thead>' +
      row('Balkan gücü (Rusya)', fmt(first.pb), fmt(now.pb), fmt(now.pr)) + row('Suriye gücü (Mısır)', fmt(first.ps), fmt(now.ps), fmt(now.pe)) +
      row('Bilinen teknoloji', first.techs, now.techs, null) + row('Ortalama teknoloji gecikmesi', fmt(first.gap, 1) + ' yıl', fmt(now.gap, 1) + ' yıl', null) +
      row('Yıllık gelir (milyon kuruş)', fmt(first.income), fmt(now.income), null) + row('Borç (milyon kuruş)', fmt(first.debt), fmt(now.debt), null) + row('İstikrar', first.stab, now.stab, null) + row('Bağımlılık', first.dep, now.dep, null) + '</table>' + spark() +
      '<p class="note">' + (now.pb >= now.pr ? 'Balkan\'da Rusya ile başa baş ya da öndesin.' : 'Balkan\'da gücün Rusya\'nın %' + Math.round(100 * now.pb / now.pr) + M.sfx(Math.round(100 * now.pb / now.pr), 'i') + '.') + ' ' + (now.ps >= now.pe ? 'Suriye\'de Mısır\'dan güçlüsün.' : 'Mısır, Suriye\'de senden güçlü.') + '</p>';
    return modal('On yıl raporu · ' + now.y, body, btn('next', 'Devam', { cls: 'btn primary' }), 'report');
  }
  function spark() {
    var h = s.history.filter(function (x, i, a) { return i === 0 || x.y !== a[i - 1].y; }); if (h.length < 2) return '';
    var W = 520, H = 150, pad = 30, max = 0; h.forEach(function (x) { max = Math.max(max, x.pb, x.pr, x.ps, x.pe); }); max = Math.ceil(max / 20) * 20 || 20;
    function X(i) { return pad + (W - pad - 10) * i / (h.length - 1); } function Y(v) { return H - 20 - (H - 34) * v / max; }
    function path(k) { return h.map(function (x, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x[k]).toFixed(1); }).join(' '); }
    var grid = ''; for (var g = 0; g <= max; g += max / 4) grid += '<line x1="' + pad + '" x2="' + (W - 10) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" class="gl"/><text x="' + (pad - 6) + '" y="' + (Y(g) + 4) + '" class="gt" text-anchor="end">' + Math.round(g) + '</text>';
    return '<figure class="spark"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Güç karşılaştırması">' + grid +
      '<text x="' + pad + '" y="' + (H - 4) + '" class="gt">' + h[0].y + '</text><text x="' + (W - 10) + '" y="' + (H - 4) + '" class="gt" text-anchor="end">' + h[h.length - 1].y + '</text>' +
      '<path d="' + path('pr') + '" class="ln ru"/><path d="' + path('pe') + '" class="ln eg"/><path d="' + path('pb') + '" class="ln us"/><path d="' + path('ps') + '" class="ln us2"/></svg>' +
      '<figcaption><span class="k us"></span>Biz (Balkan) <span class="k us2"></span>Biz (Suriye) <span class="k ru"></span>Rusya <span class="k eg"></span>Mısır</figcaption></figure>';
  }

  // ---------- intro and end ----------
  function intro() {
    var saved = load();
    var resume = saved && saved.s && saved.s.v === 2 && !saved.s.over && (saved.s.year > M.START || (saved.s.decisions || []).length > 0);
    return '<main class="intro"><div class="paper-sheet"><p class="place">İstanbul, 20 Kasım 1815</p><h1>Sadrazamın brifingi</h1>' +
      '<p>Napolyon savaşları bitti; Avrupa Paris\'te barışı imzaladı. İmparatorluk yerinde, ama üç dosya masada:</p>' +
      '<ul class="brief"><li><b>Hazine boş.</b> ' + gloss('Vergiyi iltizamcılar topluyor; devletin eline yarısı geçmiyor.') + '</li><li><b>Ordu Yeniçerilerin elinde.</b> ' + gloss('Kâğıtta 60 bin, sahada talimsiz ve her yeniliğe düşman. Gücün Rusya\'nın dörtte biri kadar.') + '</li><li><b>Mısır valisi güçleniyor.</b> ' + gloss('Mehmed Ali Fransız subaylarla yeni bir ordu kuruyor. Kuzeyde Rusya Balkanları gözlüyor.') + '</li></ul>' +
      '<div class="goalbox"><b>Hedefin 1840\'a kadar:</b> ' + gloss('Ocak\'ı kaldırmak, Balkan\'da Rusya\'ya denk bir ordu kurmak ve toprak kaybetmemek. Sağdaki "Güce giden yol" sıradaki adımı gösterir.') + '</div>' +
      '<p>Her yıl birkaç karar ver, sonra <b>Yılı bitir</b>. Her düğmenin altında, kararın neyi değiştireceği "önce → sonra" olarak yazar. Altı noktalı kelimelere dokunursan ne demek olduğunu görürsün. Para birimi milyon kuruş; reform gücü para değildir.</p>' +
      '<p class="note">Bu bir deneme: harita ve süs yok, yalnızca kararlar. 20–30 dakika sürer. Sonunda üç kararını ve nedenini, bir de "devam etmek ister miydin?" sorusunu soracağız.</p>' +
      '<label class="field">Adın (isteğe bağlı) <input id="pname" type="text" maxlength="40" value="' + esc(ui.name) + '" autocomplete="off"></label>' +
      '<div class="actions">' + btn('start', 'Başla', { cls: 'btn primary big' }) + (resume ? btn('resume', 'Kaldığın yerden devam et (' + saved.s.year + ')', { cls: 'btn' }) : '') + '</div></div></main>';
  }
  function endView() {
    var v = M.verdict(s);
    var reason = s.endReason === 'coup' ? 'İstikrar çöktü; ' + (s.year - 1) + ' yılında saray darbesi.' : '1 Ocak 1841. Deneme burada bitiyor; tam oyunda yol 1914\'e uzanır.';
    var picks = ui.picks || {};
    var dec = s.decisions.map(function (d, i) { var on = picks[i] != null; return '<label class="dec' + (on ? ' on' : '') + '"><input type="checkbox" data-act="pick" data-arg="' + i + '"' + (on ? ' checked' : '') + '><span><b>' + d.y + '</b> ' + esc(d.t) + '</span></label>' + (on ? '<textarea class="reason" id="why' + i + '" data-arg="' + i + '" placeholder="Neden bu kararı verdin?">' + esc(picks[i]) + '</textarea>' : ''); }).join('');
    var n = Object.keys(picks).length, sent = ui.sent, G = M.goals(s);
    return '<main class="end"><div class="paper-sheet"><p class="place">' + esc(reason) + '</p><h1>' + esc(v.title) + '</h1>' +
      '<div class="areas">' + G.map(function (g) { return '<div class="area"><span>' + (g.done ? '✓ ' : '') + esc(g.n) + '</span>' + bar(g.v, 1) + '<b>' + Math.round(g.v * 100) + '</b>' + why(g.why) + '</div>'; }).join('') + '</div>' +
      '<p class="note">Tarihin Hükmü\'nün deneme sürümü: yedi alan ayrı ayrı tartılır, tek skor yoktur.</p>' +
      '<div class="areas">' + v.areas.map(function (a) { return '<div class="area"><span>' + esc(a.n) + '</span>' + bar(a.v, 100) + '<b>' + a.v + '</b>' + why(a.why) + '</div>'; }).join('') + '</div>' + spark() + '</div>' +
      '<div class="paper-sheet survey"><h2>Üç kararın</h2><p>Aşağıdan en önemli bulduğun <b>üç kararı</b> seç ve her birinin nedenini bir iki cümleyle yaz.</p><div class="decs">' + (dec || '<p>Hiç karar kaydedilmedi.</p>') + '</div>' +
      '<p class="count">' + n + ' / 3 seçildi</p>' +
      '<h2>Devam etmek ister miydin?</h2><div class="seg wide">' + ['Evet', 'Belki', 'Hayır'].map(function (x) { return '<button class="' + (ui.cont === x ? 'on' : '') + '" data-act="cont" data-arg="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
      '<textarea id="contwhy" placeholder="Neden? Seni ne çekti ya da ne sıktı?">' + esc(ui.contWhy || '') + '</textarea>' +
      '<textarea id="note" placeholder="İstersen: anlamadığın ya da değiştirmek istediğin bir şey">' + esc(ui.note || '') + '</textarea>' +
      '<div class="actions">' + btn('submit', 'Sonucu gönder', { cls: 'btn primary big', disabled: n !== 3 || !ui.cont }) + btn('again', 'Yeniden oyna', { cls: 'btn ghost' }) + '</div>' +
      (sent ? '<div class="sent"><p>' + esc(sent.msg) + '</p><textarea id="outtext" readonly>' + esc(sent.text) + '</textarea>' + btn('copy', 'Metni kopyala', { cls: 'btn' }) + '</div>' : '') + '</div></main>';
  }
  function resultText() {
    var v = M.verdict(s), picks = ui.picks || {}, mins = Math.max(1, Math.round((Date.now() - s.started) / 60000));
    var t = 'Proje 1815 · Kâğıt döngü 2. sürüm sonucu\nOyuncu: ' + (ui.name || 'isimsiz') + ' · Tohum ' + s.seed + ' · ' + mins + ' dk · Bitiş ' + (s.year - 1) + (s.endReason === 'coup' ? ' (darbe)' : '') + '\nHüküm: ' + v.title + '\n';
    t += 'Hedefler: ' + M.goals(s).map(function (g) { return g.n + ' ' + Math.round(g.v * 100) + '%'; }).join(' · ') + '\n';
    t += v.areas.map(function (a) { return a.n + ' ' + a.v; }).join(' · ') + '\n\nÜç karar:\n';
    Object.keys(picks).forEach(function (i, k) { var d = s.decisions[i]; t += (k + 1) + ') ' + d.y + ' · ' + d.t + '\n   Neden: ' + (picks[i] || '—') + '\n'; });
    t += '\nDevam etmek ister miydim: ' + ui.cont + (ui.contWhy ? ' · ' + ui.contWhy : '') + '\n';
    if (ui.note) t += 'Not: ' + ui.note + '\n';
    return t;
  }
  function submit() {
    var text = resultText();
    ui.sent = { msg: 'Kaydediliyor…', text: text }; render();
    var rec = { v: 2, name: ui.name || '', seed: s.seed, endYear: s.year - 1, endReason: s.endReason, verdict: M.verdict(s), goals: M.goals(s), picks: Object.keys(ui.picks).map(function (i) { return { y: s.decisions[i].y, t: s.decisions[i].t, why: ui.picks[i] || '' }; }),
      cont: ui.cont, contWhy: ui.contWhy || '', note: ui.note || '', minutes: Math.max(1, Math.round((Date.now() - s.started) / 60000)), decisions: s.decisions, history: s.history, at: new Date().toISOString() };
    var done = false;
    function fallback() { if (done) return; done = true; ui.sent = { msg: 'Bu sayfa sonucu otomatik kaydedemedi. Aşağıdaki metni kopyalayıp Tolga\'ya gönder.', text: text }; render(); }
    try {
      if (!window.claude || !window.claude.use) return fallback();
      window.claude.use('db').then(function (db) {
        if (!db) return fallback();
        db.collection('responses').add(rec).then(function () { done = true; ui.sent = { msg: 'Kaydedildi, teşekkürler. Aynı metni istersen kopyalayıp Tolga\'ya da gönderebilirsin.', text: text }; render(); }, fallback);
      }, fallback);
      setTimeout(fallback, 12000);
    } catch (e) { fallback(); }
  }

  // ---------- flow ----------
  function nextEvent() {
    ui.card = null; ui.result = null; s.cardId = null; s.queue = s.queue || [];
    while (s.queue.length) { var id = s.queue.shift(); var c = M.eventCard(s, id); if (c) { ui.card = c; s.cardId = id; ui.view = 'event'; return; } }
    ui.view = s.over ? 'end' : 'play'; ui.nizamStart = s.nizamTarget;
  }
  function fix(x) { x.rushed = x.rushed || {}; x.carry = x.carry || 0; x.temp = x.temp || []; return x; }
  function startEvents() { s.queue = s.events.slice(); s.events = []; nextEvent(); }
  function resume() {
    ui.nizamStart = s.nizamTarget; ui.picks = ui.picks || {};
    if (s.over) { ui.view = 'end'; return; }
    if (s.cardId) { var c = M.eventCard(s, s.cardId); if (c) { ui.card = c; ui.view = 'event'; return; } }
    if (s.queue && s.queue.length) { nextEvent(); return; }
    if (s.events && s.events.length) { startEvents(); return; }
    ui.view = 'play';
  }
  function endTheYear() {
    if (s.nizamTarget !== ui.nizamStart) M.A.commitNizam(s);
    var y = s.year, lines = M.endYear(s);
    ui.report = { year: y, lines: lines }; ui.view = 'report'; ui.decade = (y === 1825 || y === 1835) && !s.over;
    window.scrollTo(0, 0);
  }
  function after() {
    if (ui.view === 'report') { if (ui.decade) { ui.decade = false; ui.view = 'decade'; return; } if (s.over) { ui.view = 'end'; return; } startEvents(); return; }
    if (ui.view === 'decade') { startEvents(); return; }
    if (ui.view === 'result') { nextEvent(); return; }
  }
  function flash(msg) { var f = document.createElement('div'); f.className = 'toast'; f.textContent = msg; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 2600); }
  function act(a, arg) {
    var r;
    switch (a) {
      case 'term': ui.term = arg; break;
      case 'closeterm': ui.term = null; break;
      case 'start': ui.name = (document.getElementById('pname') || {}).value || ''; s = M.newGame(1815); ui.picks = {}; ui.sent = null; ui.cont = null; startEvents(); break;
      case 'resume': var sv = load(); if (!sv || !sv.s) { clearSave(); break; } s = fix(sv.s); ui.name = sv.name || ''; ui.picks = {}; resume(); break;
      case 'tab': ui.tab = arg; window.scrollTo(0, 0); break;
      case 'why': ui.why = arg; break;
      case 'closewhy': ui.why = null; break;
      case 'tax': M.A.setTax(s, +arg); break;
      case 'trade': M.A.setTrade(s, arg); break;
      case 'borrowD': r = M.A.borrowD(s); break;
      case 'borrowF': r = M.A.borrowF(s); break;
      case 'repay': r = M.A.repay(s); break;
      case 'project': r = M.A.project(s, arg); break;
      case 'rushP': r = M.A.rushProject(s, arg); break;
      case 'focus': M.A.focus(s, arg); break;
      case 'advisor': r = M.A.advisor(s, arg); break;
      case 'import': r = M.A.importRifles(s); break;
      case 'raise': r = M.A.raise(s, arg); break;
      case 'rushI': r = M.A.rushInst(s, arg); break;
      case 'lower': r = M.A.lower(s, arg); break;
      case 'law': r = M.A.law(s, arg); if (r && r.result) { ui.result = r.result; ui.view = 'result'; } break;
      case 'favor': r = M.A.favor(s); break;
      case 'dip': r = M.A.dip(s, arg); break;
      case 'nizam': M.A.setNizam(s, s.nizamTarget + (+arg)); break;
      case 'end': endTheYear(); break;
      case 'choose': var o = ui.card.opts[+arg]; if (!o || o.disabled) return; ui.result = o.fn(); s.cardId = null; ui.card = null; ui.view = 'result'; break;
      case 'next': after(); break;
      case 'pick': ui.picks = ui.picks || {}; if (ui.picks[arg] != null) delete ui.picks[arg]; else if (Object.keys(ui.picks).length < 3) ui.picks[arg] = ''; else flash('En fazla üç karar seçebilirsin.'); break;
      case 'cont': ui.cont = arg; break;
      case 'submit': submit(); return;
      case 'copy': var ta = document.getElementById('outtext'); if (ta) { var txt = ta.value; try { navigator.clipboard.writeText(txt).then(function () { flash('Kopyalandı'); }, function () { ta.select(); flash('Metni seçtim; kopyala.'); }); } catch (e) { ta.select(); } } return;
      case 'again': clearSave(); s = null; ui = { view: 'intro', tab: 'butce', name: ui.name, picks: {}, term: null }; break;
    }
    if (r && r.ok === false && r.why) flash(r.why);
    render();
  }

  // ---------- render ----------
  function render() {
    var y = window.scrollY, html;
    if (!s || ui.view === 'intro') html = intro();
    else if (ui.view === 'end') html = endView();
    else {
      var pane = { butce: tabButce, proje: tabProje, bilim: tabBilim, reform: tabReform, diplomasi: tabDip, ordu: tabOrdu }[ui.tab]();
      html = header() + '<div class="layout"><div class="main">' + tabs() + pane + '</div>' + side() + '</div>' +
        '<footer class="endbar"><span class="hint">' + (s.focus ? 'Araştırma: ' + esc(M.TECHS[s.focus].n) : 'Araştırma konusu seçilmedi: Divan en ucuz konuya geçecek') + ' · Nizam hedefi ' + s.nizamTarget + ' bin</span>' + btn('end', 'Yılı bitir · ' + s.year + ' →', { cls: 'btn primary' }) + '</footer>';
      if (ui.view === 'event' && ui.card) html += eventModal();
      if (ui.view === 'result' && ui.result) html += resultModal();
      if (ui.view === 'report') html += reportModal();
      if (ui.view === 'decade') html += decadeModal();
      if (ui.why) html += whyModal();
    }
    if (ui.term) html += termModal();
    // keep the survey's text while re-rendering
    var keep = {}; ['contwhy', 'note', 'pname'].forEach(function (id) { var el = document.getElementById(id); if (el) keep[id] = el.value; });
    document.querySelectorAll('textarea.reason').forEach(function (el) { if (ui.picks && ui.picks[el.dataset.arg] != null) ui.picks[el.dataset.arg] = el.value; });
    if (keep.contwhy != null) ui.contWhy = keep.contwhy; if (keep.note != null) ui.note = keep.note; if (keep.pname != null) ui.name = keep.pname;
    app.innerHTML = html;
    if (ui.view === 'play' || ui.view === 'end') window.scrollTo(0, y);
    if (s) save();
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'term') { e.preventDefault(); e.stopPropagation(); act('term', b.dataset.arg); return; }
    if (b.disabled) return; if (b.tagName === 'INPUT') return; e.preventDefault(); act(b.dataset.act, b.dataset.arg);
  });
  app.addEventListener('keydown', function (e) { var t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t.classList && t.classList.contains('term')) { e.preventDefault(); act('term', t.dataset.arg); } });
  app.addEventListener('change', function (e) { var b = e.target; if (b.matches('input[type=checkbox][data-act]')) act(b.dataset.act, b.dataset.arg); });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.classList.contains('reason')) ui.picks[t.dataset.arg] = t.value;
    if (t.id === 'contwhy') ui.contWhy = t.value; if (t.id === 'note') ui.note = t.value; if (t.id === 'pname') ui.name = t.value;
    var sb = document.querySelector('[data-act=submit]'); if (sb) sb.disabled = Object.keys(ui.picks || {}).length !== 3 || !ui.cont;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (ui.why || ui.term)) { if (ui.term) ui.term = null; else ui.why = null; render(); } });

  // live updates keep the game in progress
  function boot(data) { if (data && data.s && data.s.v === 2) { s = fix(data.s); ui.tab = data.tab || 'butce'; ui.name = data.name || ''; ui.picks = data.picks || {}; ui.cont = data.cont || null; resume(); } render(); }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return s ? { s: s, tab: ui.tab, name: ui.name, picks: ui.picks, cont: ui.cont } : {}; }); } catch (e) { }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude && window.claude.hot && window.claude.hot.data);
})();
// ==UI END==

</script>

</body>
</html>
