  };

  // a windowed event: whether this game has it, and its year inside the historical window, are drawn once per seed
  function due(s, id, lo, hi, prob) {
    if (s.fired[id]) return false;
    if (prob < 1 && drawK(s, 'has-' + id) >= prob) return false;
    var y0 = lo + Math.floor(drawK(s, 'when-' + id) * (hi - lo + 1));
    return s.year >= y0 && s.year <= hi + 2;
  }
  function variant(s, id) { return drawK(s, 'var-' + id) < 0.5; }
  function egyptOpen(s) { return s.egypt.independent || s.lost.Suriye === 'Mısır' || s.lost.Girit === 'Mısır' || s.lost.Hicaz === 'Mısır'; }
  function genEvents(s) {

    // a war in progress comes first

    if (s.cw) E.push('cw');

    // Greek revolt
    if (s.greek === 'none' && y >= 1820 && y <= 1840) {
      var p = ((y === 1821 ? 0.7 : 0.3) + (55 - st) / 100 + (s.greekBoost ? 0.2 : 0)) * ev;
      if (draw(s, 'greek') < p) E.push('greek_start');
    } else if (s.greek === 'active') {
      E.push(y >= 1828 ? 'greek_powers' : 'greek_continue');
    }
    if (s.greek === 'egypt' && !s.navarino && y >= 1827) E.push('navarino');
    if (s.serbia === 'ottoman' && y >= 1817 && y <= 1826 && draw(s, 'serbia') < 0.3 * ev) E.push('serbia');
    var thr = ruThr(s);
    if (s.tension >= thr && !s.war && !s.rwar && !s.cw) E.push(s.split ? 'ru_crisis' : 'russia_ultimatum');
    if (!s.egyptCrisis && !s.egypt.independent && !s.egypt.settled && y >= 1828) {
      var fe = forecast(s, 'syria', 'egypt');
      if (fe.ratio < 1.25 || s.egypt.loyalty < 35) { if (draw(s, 'egyptcrisis') < 0.6 || y >= 1833) E.push('egypt_crisis'); }
    }
    if (y > START && draw(s, 'harvest') < 0.15 * ev && !(s.famY && y - s.famY < 3)) E.push('harvest'); // no famine within two years of the last, so it does not repeat
    if (s.ocak && s.nizam >= 25 && draw(s, 'janriot') < 0.3 * ev) E.push('jan_unrest');
    if (!s.offers.izmir && y >= 1822 && y <= 1832 && draw(s, 'izmir') < 0.4) E.push('izmir_offer');
    if (s.F >= 40 && !s.bankrupt && draw(s, 'creditors') < 0.4 * ev) E.push('creditors');
    // version 3: the pool. Each needs its condition; the seed decides which a game sees and when.
    if (s.era === 1) {
      if (due(s, 'tepedelen', 1819, 1822, 0.75)) fire('tepedelen');

    } else if (s.era >= 3) {
      if (!s.cw) genEvents4(s, E, fire, st, ev);

      if (regionOn(s, 'Eflak') && due(s, 'eflak1848', 1848, 1849, 1)) fire('eflak1848');
      if (due(s, 'multeci', 1849, 1850, 0.8)) fire('multeci');
      if (!s.crimea && !s.war && due(s, 'holy', 1852, 1854, 1)) {
        fire('holy'); // the quarrel over the Holy Places is diplomatic: it comes whoever is stronger; strength changes its terms
      }
      if ((s.lean || 0) >= 0.3 && !s.war && !s.rwar && (!s.concY || y - s.concY >= 5) && y >= 1843) { if (E.length < 3) { E.push('concert'); s.concY = y; } }

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(v, d) { d = d == null ? 0 : d; var x = Number(v); if (!isFinite(x)) return '–'; var str = Math.abs(x).toFixed(d).replace('.', ','); return (x < 0 ? '−' : '') + str; }
  function sg(v, d) { return (v > 0 ? '+' : '') + fmt(v, d); }
  function pct(v) { return '%' + Math.round(v * 100); }
  function money(v, d) { return fmt(v, d) + ' milyon kuruş'; }
  function btn(act, label, opts) { opts = opts || {}; return '<button class="' + (opts.cls || 'btn') + '" data-act="' + esc(act) + '"' + (opts.arg != null ? ' data-arg="' + esc(opts.arg) + '"' : '') + (opts.disabled ? ' disabled' : '') + '>' + label + '</button>'; }
  function why(t) { return t ? '<span class="why">' + esc(t) + '</span>' : ''; }

  // ---------- storage: every call is guarded; without storage the game still plays, it only cannot resume ----------
  var mem = {};
  function stGet(k) { try { var v = window.localStorage.getItem(k); return v == null ? (k in mem ? mem[k] : null) : v; } catch (e) { return k in mem ? mem[k] : null; } }
  function stSet(k, v) { mem[k] = v; try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function stDel(k) { delete mem[k]; try { window.localStorage.removeItem(k); } catch (e) { } }
  function save() { if (s && rec) ui.saved = stSet(KEY, JSON.stringify({ v: 3, s: s, rec: rec, tab: ui.tab })); }
  function load() { try { var d = JSON.parse(stGet(KEY) || 'null'); return d && d.v === 3 && d.s && (d.s.v === 41 || d.s.v === 40 || d.s.v === 32 || d.s.v === 31 || d.s.v === 3) && d.rec && d.rec.log ? d : null; } catch (e) { return null; } }
  function isOld(d) { return !!d && d.s.v !== 41; } // a save of version 3.0, 3.1, 3.2 or 4.0 (4.1: a 4.0 save is rebuilt from its commands too)
  function oldVer(d) { return d.s.v === 3 ? '3.0' : (d.s.v === 31 ? '3.1' : (d.s.v === 40 ? '4.0' : '3.2')); }
  function clearSave() { stDel(KEY); }
  function meta() { try { var m = JSON.parse(stGet(META) || '{}'); return m && typeof m === 'object' ? m : {}; } catch (e) { return {}; } }
  function setMeta(m) { stSet(META, JSON.stringify(m)); }

  // ---------- the play record: what the owner reads afterwards ----------
  function newRec(seed, diff, st) { var m = meta(); return { v: M.VERSION, id: Math.random().toString(36).slice(2, 10), seed: String(seed), diff: diff, st: st || M.START, at: new Date().toISOString(), log: [], dec: [], yrs: {}, idle: {}, survey: {}, restarts: m.restarts || 0 }; }
  function startY() { return (s && s.start) || M.START; }
  // 4.0: what the late game needs in the record: the rank, the meaningful actions and the money left unspent, year by year
  var MINOR = /^(nizam|focus|favor|end|cont|fin):?/;
  function rankList() { var out = [], seen = {}; (s.history || []).forEach(function (h) { if (h.y >= startY() && h.rk && !seen[h.y]) { seen[h.y] = 1; out.push([h.y, h.rk]); } }); return out; }
  function actList() { var by = {}; (rec.dec || []).forEach(function (d) { if (!MINOR.test(d[1])) by[d[0]] = (by[d[0]] || 0) + 1; }); return Object.keys(by).sort().map(function (y) { return [+y, by[y]]; }); }
  function idleList() { var I = rec.idle || {}; return Object.keys(I).sort().map(function (y) { return [+y, I[y]]; }); }
  function yrRec(y) { y = String(y); return rec.yrs[y] || (rec.yrs[y] = { t: 0, n: 0, sg: [], fo: [], tp: 0 }); }
  function keyNums() { return [Math.round(s.treasury), M.stability(s), Math.floor(s.rp), Math.round(M.forecast(s, 'balkan', 'russia', false, true).ratio * 100), s.nizam, s.nizamTarget]; }
  function touch() { // seconds spent in a year; a long pause counts as ninety seconds at most
    var now = Date.now();
    if (s && rec && !s.over && ui.view !== 'intro') { var dt = Math.min(90000, Math.max(0, now - (ui.tick || now))); var Y = yrRec(s.year); Y.t = Math.round((Y.t + dt / 1000) * 10) / 10; }
    ui.tick = now;
  }
  // every change to the game goes through the model's one door, and is written down: the command, and the key numbers before and after
  function doCmd(tok, quiet) {
    var y = s.year, k0 = keyNums(), r = M.apply(s, tok);
    if (!r || r.ok === false) { if (r && r.why && r.why !== 'preview' && !quiet) flash(r.why); return r || { ok: false }; }
    var k1 = keyNums(), last = rec.log.length - 1;
    if (tok.indexOf('nizam:') === 0 && last >= 0 && rec.log[last].indexOf('nizam:') === 0) { rec.log[last] = tok; var d = rec.dec[rec.dec.length - 1]; d[1] = tok; d[3] = k1; }
    else { rec.log.push(tok); rec.dec.push([y, tok, k0, k1]); }
    var Y = yrRec(y); Y.n++; if (Y.sg.indexOf(tok) >= 0 && Y.fo.indexOf(tok) < 0) Y.fo.push(tok);
    if (tok.indexOf('nizam:') === 0) Y.sg.forEach(function (x) { if (x.indexOf('nizam:') === 0 && Y.fo.indexOf(x) < 0 && Math.abs(+x.slice(6) - k1[5]) < Math.abs(+x.slice(6) - k0[5])) Y.fo.push(x); }); // a step toward the suggested army size counts
    return r;
  }

  // ---------- codes: a record is small because the game is deterministic (seed + difficulty + commands = the same game) ----------
  var packLog = M.packLog, unpackLog = M.unpackLog;
  function b64e(str) { var b = unescape(encodeURIComponent(str)); return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function b64d(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  function times() { var out = []; if (!s) return out; for (var y = startY(); y <= s.year; y++) { var Y = rec.yrs[String(y)]; out.push(Y ? Math.round(Y.t) : 0); } return out; }
  function sugOf(Y) { return [(Y.cs || 0) + Y.sg.filter(function (x) { return x.indexOf('wait:') !== 0; }).length, (Y.cf || 0) + Y.fo.length, Y.tp || 0]; } // shown (those with an action), followed, taps; cs and cf are counts carried in by a save code
  function sugList() { var out = []; Object.keys(rec.yrs).sort().forEach(function (y) { var c = sugOf(rec.yrs[y]); if (c[0] || c[1] || c[2]) out.push([+y, c[0], c[1], c[2]]); }); return out; }
  function sugTotals() { var sh = 0, fo = 0, tp = 0; sugList().forEach(function (c) { sh += c[1]; fo += c[2]; tp += c[3]; }); return { shown: sh, followed: fo, taps: tp }; }
  function saveCode() { return 'P1815K41.' + b64e(JSON.stringify({ sd: rec.seed, df: rec.diff, st: startY(), lg: packLog(rec.log), h: hash(JSON.stringify(s)), id: rec.id, at: rec.at, t: times(), sg: sugList(), rs: rec.restarts, sv: rec.survey, tz: idleList() })); }
  function dataBlock() { // for the owner: the whole game replays from this; time per year, suggestions, the survey, and (4.0) the rank, actions and idle money of every year ride along
    return 'P1815R41.' + b64e(JSON.stringify({ sd: rec.seed, df: rec.diff, st: startY(), lg: packLog(rec.log), h: hash(JSON.stringify(s)), id: rec.id, at: rec.at, t: times(), sg: sugList(), rs: rec.restarts, sv: rec.survey, rk: rankList(), ac: actList(), tz: idleList() }));
  }
  function readCode(text) {
    var m = /P1815[KR](41|4|32|31|3)\.([A-Za-z0-9_-]+)/.exec(String(text || '').replace(/\s+/g, '')); if (!m) return { err: 'Bu bir kayıt kodu değil. Kod "P1815K41." ile başlar; tamamını yapıştır.' };
    var d; try { d = JSON.parse(b64d(m[2])); } catch (e) { return { err: 'Kod eksik ya da bozuk görünüyor. Tamamını kopyalayıp yeniden dene.' }; }
    var cmds = unpackLog(String(d.lg || '')); if (!cmds || !M.DIFF[d.df] || d.sd == null) return { err: 'Kod okunamadı: başka bir sürüme ait olabilir.' };
    return { d: d, cmds: cmds, old: m[1] !== '41', ver: { 3: '3.0', 31: '3.1', 32: '3.2', 4: '4.0' }[m[1]] || '4.1' };
  }
  // build a game from a command list. A 3.0 list is replayed under the 3.1 rules as far as it still fits (M.replayOld).
  function rebuild(seed, diff, cmds, old, evlog, from, st) {
    var keep = { s: s, rec: rec }, list = cmds, info = null;
    try {
      var st0 = old && old !== '4.0' ? M.START : (st || M.START); // 3.x records began in 1816; a 4.0 record keeps its start year
      if (old) { info = M.replayOld(seed, diff, cmds, evlog, st0); list = info.used; if (cmds.length && !list.length) throw new Error('nothing applied'); }
      s = M.newGame(seed, diff, st0); rec = newRec(seed, diff, st0);
      if (from) { rec.id = from.id || rec.id; rec.at = from.at || rec.at; rec.restarts = from.restarts || 0; rec.survey = from.survey || {}; var fi = from.idle || []; if (Array.isArray(fi)) fi.forEach(function (x) { rec.idle[x[0]] = x[1]; }); else Object.keys(fi).forEach(function (y) { rec.idle[y] = fi[y]; }); /* a code carries pairs; a 4.0 save, an object */ }
      for (var i = 0; i < list.length; i++) doCmd(list[i], true);
      if (old) rec.from30 = [info.total, list.length];
    } catch (e) { s = keep.s; rec = keep.rec; return { err: true }; }
    return { info: info, keep: keep };
  }
  function oldNote(info, ver) { return (ver || '3.2') + ' kaydın ' + M.VERSION + ' kurallarıyla yeniden kuruldu: ' + info.total + ' kararın ' + info.used.length + ' tanesi uygulandı; oyun ' + (s.pause ? (M.ENDS[s.era - 1]) + '\'taki hükümden (artık 1914\'e kadar devam edebilirsin)' : (s.over ? 'sonuç ekranından' : s.year + ' yılından')) + ' sürüyor.'; }
  function importCode(text) {
    var r = readCode(text); if (r.err) return r.err;
    var b = rebuild(r.d.sd, r.d.df, r.cmds, r.old ? r.ver : false, null, { id: r.d.id, at: r.d.at, restarts: r.d.rs, survey: r.d.sv, idle: r.d.tz }, r.d.st || M.START);
    if (b.err) return r.old ? 'Bu ' + r.ver + ' kodu ' + M.VERSION + ' kurallarıyla kurulamadı. Yeni bir oyun başlatabilirsin.' : 'Kod okunamadı: aynı oyun kurulamadı.';
    if (!r.old && r.d.h && hash(JSON.stringify(s)) !== r.d.h) { s = b.keep.s; rec = b.keep.rec; return 'Bu kod oyunun başka bir sürümünde üretilmiş; aynı oyun kurulamadı.'; }
    (r.d.t || []).forEach(function (t, i) { var y0 = r.old && r.ver !== '4.0' ? M.START : (r.d.st || M.START); if (t && y0 + i <= s.year) yrRec(y0 + i).t = t; });
    (r.d.sg || []).forEach(function (c) { if (c[0] > s.year) return; var Y = yrRec(c[0]); Y.sg = []; Y.fo = []; Y.cs = c[1]; Y.cf = c[2]; Y.tp = c[3] || 0; });
    ui.note = r.old ? oldNote(b.info, r.ver) : null;
    return null;
  }

  // ---------- optional automatic sending: queued first, sent in the background, never in the player's way ----------
  function payload(reason) {
    var v = M.verdict(s);
    return JSON.stringify({ app: 'p1815-kagit', v: M.VERSION, reason: reason, id: rec.id, seed: rec.seed, diff: rec.diff, start: startY(), at: rec.at, now: new Date().toISOString(), year: s.year, over: !!s.over, endReason: s.endReason || null,
      verdict: v.title, judge1: s.judge1 || null, judge2: s.judge2 || null, judge3: s.judge3 || null, rank: s.rank, goals: M.goals(s).map(function (g) { return [g.id, Math.round(g.v * 100)]; }), areas: v.areas.map(function (a) { return a.v; }),
      log: packLog(rec.log), dec: rec.dec, yrs: rec.yrs, ev: s.evlog, restarts: rec.restarts, survey: rec.survey, rk: rankList(), ac: actList(), tz: idleList() });
  }
  function post(reason) {
    if (!ENDPOINT || !s || !rec) return;
    var m = meta(); m.queue = m.queue || []; m.queue.push(payload(reason)); if (m.queue.length > 5) m.queue = m.queue.slice(-5); setMeta(m); flush();
  }
  function flush() {
    if (!ENDPOINT || ui.flushing || typeof fetch !== 'function') return; var q = meta().queue || []; if (!q.length) return;
    var body = q[0]; ui.flushing = true;
    function done(ok) { ui.flushing = false; if (!ok) return; var m = meta(); m.queue = (m.queue || []).filter(function (x) { return x !== body; }); setMeta(m); if (m.queue.length) setTimeout(flush, 50); }
    try { fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', keepalive: body.length < 60000, headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body }).then(function () { done(true); }, function () { done(false); }); } catch (e) { done(false); }
  }

      '<h3>Aklında kalan üç karar ve nedeni <small>istersen</small></h3>' +
      (big.length ? '<details class="remind"><summary>Kararlarını hatırla (dokun: sıradaki boş kutuya yazar)</summary><div class="hints">' + big.slice(0, 40).map(function (t, i) { return '<button class="hint" data-act="hint" data-arg="' + i + '">' + esc(t) + '</button>'; }).join('') + '</div></details>' : '') +
      ta('d1', '1. karar ve neden öyle yaptın?', 'short') + ta('d2', '2. karar ve nedeni', 'short') + ta('d3', '3. karar ve nedeni', 'short') +
      '<h3>Oyun 1914\'ten sonra, Büyük Savaş\'a doğru sürseydi devam eder miydin?</h3><div class="seg wide">' + ['Evet', 'Belki', 'Hayır'].map(function (x) { return '<button class="' + (sv.c1880 === x ? 'on' : '') + '" data-act="c1880" data-arg="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
      '<h3>Eklemek istediğin</h3>' + ta('note', 'Anlamadığın, sıkıldığın ya da hoşuna giden her şey') +
      '<label class="field">Adın <small>(isteğe bağlı)</small><input class="sv" data-sv="name" type="text" maxlength="30" value="' + esc(sv.name || '') + '" autocomplete="off"></label>' +
      '<div class="actions">' + btn('send', 'Sonucu Tolga\'ya gönder', { cls: 'btn primary big' }) + '</div>' + (ui.sendOpen ? sharePanel() : '') + '</div>';
  }
  function endView() {
    var v = M.verdict(s), G = M.goals(s);
    var reason = s.endReason === 'coup' ? 'İstikrar çöktü: ' + (s.year - 1) + ' yılında saray darbesi.' : ({ time1840: '1 Ocak 1841 · oyunu ilk hükümde bitirdin.', time1860: '1 Ocak 1861 · oyunu ikinci hükümde bitirdin.', time1880: '1 Ocak 1881 · oyunu üçüncü hükümde bitirdin.' }[s.endReason] || '1 Ocak 1914 · Tarihin Hükmü');
    var jl = [[1840, s.judge1], [1860, s.judge2], [1880, s.judge3]].filter(function (j) { return j[1]; }).map(function (j) { return j[0] + M.sfx(j[0], 'den').slice(0, -1) + ' <b>' + esc(j[1].title) + '</b>' + (j[1].rank ? ' (' + j[1].rank + '. güç)' : ''); });
    return '<main class="end"><div class="paper-sheet"><p class="place">' + esc(reason) + '</p><h1>' + esc(v.title) + '</h1>' +
      (s.rank && s.split ? '<p class="etext">Güç sıralamasında <b>' + s.rank + '.</b> sıradasın' + (s.rank <= 8 ? ': büyük güçlerden birisin.' : ': ilk sekizin dışında kaldın.') + '</p>' : '') +
      (jl.length ? '<p class="note">Önceki hükümler: ' + jl.join(' · ') + '.</p>' : '') + (s.prepared ? '<p class="note">Hazır başlangıç: ' + s.prepared + '.</p>' : '') + verdictSheet(v, G) +
      '<p class="seed">Zorluk: ' + M.DIFF[s.diff].n + ' · Tohum: <b>' + esc(s.seed) + '</b> · ' + minutes() + ' dakika · ' + rec.dec.length + ' karar</p>' +
      '<p class="note">Tohum, bu oyunun olaylarını belirleyen sayıdır: her yeni oyunda değişir, olaylar da onunla değişir.</p></div>' + survey() +
      '<div class="actions endact">' + btn('modal', 'Yeni oyun', { arg: 'newgame', cls: 'btn' }) + '</div></main>';
  }

  // ---------- flow ----------
  var DECADES = [1825, 1835, 1850, 1860, 1870, 1880, 1890, 1900, 1910];
  function sync() {
    if (!s) { ui.view = 'intro'; return; }
    if (s.over) ui.view = 'end'; else if (s.pause) ui.view = 'judge'; else ui.view = M.currentEvent(s) ? 'event' : 'play';
  }
  function startGame() {
    var old = s || (load() || {}).s, oldRec = rec || (load() || {}).rec, m = meta();
    if (old && !old.over && oldRec && oldRec.log && oldRec.log.length) m.restarts = (m.restarts || 0) + 1;
    m.games = (m.games || 0) + 1; setMeta(m);
    var h = /seed=(\d+)/.exec(window.location.hash || ''), seed = h ? h[1] : String(10000 + Math.floor(Math.random() * 90000)), st0 = ui.start || M.START;
    s = M.newGame(seed, ui.diff, st0); rec = newRec(seed, ui.diff, s.start || M.START);
    ui = { view: 'play', tab: 'harita', diff: ui.diff, start: st0, region: null, modal: 'brief', term: null, why: null, tick: Date.now() }; sync();
  }
  function resumeGame() {
    var d = load(); if (!d) { clearSave(); flash('Kayıt bulunamadı.'); return; }
    var note = null;
    if (isOld(d)) { // an older save: its commands replayed under the 3.2 rules
      var yrs = d.rec.yrs || {}, b = rebuild(d.rec.seed, d.rec.diff, d.rec.log, oldVer(d), d.s.evlog, d.rec, d.rec.st || d.s.start); // 4.1: a 4.0 save keeps its start year
      if (b.err) { clearSave(); s = null; rec = null; ui.oldFail = true; ui.view = 'intro'; return; }
      Object.keys(yrs).forEach(function (y) { if (+y <= s.year && yrs[y] && yrs[y].t) yrRec(y).t = yrs[y].t; });
      note = oldNote(b.info, oldVer(d)); d.tab = 'harita';
    } else { s = d.s; rec = d.rec; }
    rec.survey = rec.survey || {}; rec.yrs = rec.yrs || {}; rec.dec = rec.dec || []; rec.idle = rec.idle || {};
    ui = { view: 'play', tab: d.tab || 'harita', diff: s.diff, region: null, modal: note ? 'note' : null, note: note, term: null, why: null, tick: Date.now() }; sync();
  }
  function endTheYear() {
    var y0 = s.year, t0 = Math.round(s.treasury);
    var r = doCmd('end'); if (!r || r.ok === false) return;
    rec.idle[y0] = t0; // 4.0: the money left unspent when the year was closed
    ui.report = { year: r.year, lines: r.report }; ui.decade = DECADES.indexOf(r.year) >= 0; ui.hl = null;
    if (ui.decade || s.over || s.pause) post(s.over ? 'end' : (s.pause ? 'judge' + M.ENDS[s.era - 1] : 'decade' + r.year));
    window.scrollTo(0, 0);
  }
  function flash(msg) { var f = document.createElement('div'); f.className = 'toast'; f.setAttribute('role', 'status'); f.textContent = msg; document.body.appendChild(f); setTimeout(function () { f.remove(); }, 2800); }
  function copyFrom(id) {
    var ta = document.getElementById(id); if (!ta) return; var txt = ta.value;
    function fallback() { try { ta.focus(); ta.select(); if (document.execCommand && document.execCommand('copy')) flash('Kopyalandı'); else flash('Metni seçtim; "Kopyala"ya dokun.'); } catch (e) { flash('Metni elle seçip kopyala.'); } }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { flash('Kopyalandı'); }, fallback); else fallback(); } catch (e) { fallback(); }
  }
  var CMD = { tax: 1, trade: 1, borrowD: 0, borrowF: 0, repay: 0, project: 1, rushP: 1, focus: 1, advisor: 1, import: 0, raise: 1, rushI: 1, lower: 1, law: 1, retake: 1, favor: 0, fetva: 0, dip: 1, stab: 1, relief: 1, regain: 1, callup: 0, buy: 1, grant: 1, ext: 1,
    renew: 1, navy: 1, scrap: 0, bloc: 1, bid: 0, nuf: 1, conc: 1, tatil: 0, buyConc: 1, repayBig: 0 };
  function act(a, arg) {
    var r, jump = null;
    touch();
    if (a !== 'sug' && a !== 'term' && a !== 'closeterm') ui.hl = null;
    if (a in CMD) {
      var tok = CMD[a] ? a + ':' + arg : a;
      if (s.split && !ui.askOk) { var drops = M.areaDrops(s, function (b) { return M.apply(b, tok); }); if (drops.length) { ui.ask = { a: a, arg: arg, tok: tok, drops: drops }; render(); return; } } // 4.1: an action that lowers an area value at once asks first, with the numbers
      ui.askOk = false;
      r = doCmd(tok);
      if (r && r.result) ui.result = r.result;
    } else switch (a) {
      case 'askyes': var q = ui.ask; ui.ask = null; if (q) { ui.askOk = true; act(q.a, q.arg); } return;
      case 'askno': ui.ask = null; break;
      case 'term': ui.term = arg; break;
      case 'closeterm': ui.term = null; break;
      case 'why': ui.why = arg; break;
      case 'closewhy': ui.why = null; break;
      case 'modal': ui.modal = arg; ui.codeErr = null; if (arg === 'share') post('send'); break;
      case 'close': ui.modal = null; break;
      case 'diff': ui.diff = arg; break;
      case 'start': ui.start = +arg; break;
      case 'new': if (arg === 'ask') { ui.askNew = true; break; } startGame(); window.scrollTo(0, 0); break;
      case 'resume': resumeGame(); break;
      case 'tab': ui.tab = arg; jump = '.tabs'; break;
      case 'goto': ui.tab = arg; ui.modal = null; jump = ui.why === 'istikrar' && arg === 'reform' ? '#rf-stab' : '.tabs'; ui.why = null; break;
      case 'jump': jump = '#' + arg; break;
      case 'guide': ui.guideOff = arg === 'off'; break;
      case 'sug': var sgn = (ui.adv || [])[+arg]; if (!sgn) break; yrRec(s.year).tp++; ui.tab = sgn.tab; ui.hl = sgn.id; if (sgn.id.indexOf('map:') === 0) ui.region = sgn.id.slice(4); break;
      case 'region': ui.region = arg; var Yr = yrRec(s.year); Yr.sg.forEach(function (x) { if (x === 'map:' + arg && Yr.fo.indexOf(x) < 0) Yr.fo.push(x); }); jump = window.innerWidth < 900 ? '.rinfo' : null; break;
      case 'nizam': doCmd('nizam:' + (s.nizamTarget + (+arg))); break;
      case 'end': endTheYear(); break;
      case 'choose': r = doCmd('ev:' + arg); if (r && r.result) ui.result = r.result; window.scrollTo(0, 0); break;
      case 'next': if (ui.result) ui.result = null; else if (ui.report) ui.report = null; else if (ui.decade) ui.decade = false; window.scrollTo(0, 0); break;
      case 'cont': r = doCmd('cont'); if (r && r.ok !== false) { ui.modal = 'brief'; ui.tab = 'harita'; ui.region = null; window.scrollTo(0, 0); } break;
      case 'fin': doCmd('fin'); post('end'); window.scrollTo(0, 0); break;
      case 'rate': var pr = String(arg).split(':'); rec.survey[pr[0]] = +pr[1]; break;
      case 'c1880': rec.survey.c1880 = arg; break;
      case 'hint': var big = bigDecisions(), tx = big[+arg], slot = ['d1', 'd2', 'd3'].filter(function (k) { return !(rec.survey[k] || '').trim(); })[0]; if (tx && slot) rec.survey[slot] = tx + ' — çünkü '; else if (tx) flash('Üç kutu da dolu.'); break;
      case 'send': ui.sendOpen = true; post('survey'); jump = '.sent'; break;
      case 'copy': copyFrom(arg); return;
      case 'share': try { navigator.share({ title: 'Proje 1815 · oyun kaydı', text: shareText(false) }).catch(function () { }); } catch (e) { flash('Paylaşım açılamadı; "Metni kopyala"yı dene.'); } return;
      case 'importgo': var el = document.getElementById('codein'); ui.codeIn = el ? el.value : ''; var err = importCode(ui.codeIn); if (err) { ui.codeErr = err; break; } ui.codeErr = null; ui.codeIn = ''; ui.modal = ui.note ? 'note' : null; ui.tab = 'harita'; ui.region = null; ui.view = 'play'; sync(); flash('Oyun yüklendi: ' + (s.pause ? M.ENDS[s.era - 1] + ', hüküm' : s.year) + '.'); break;
    }
    if (s) sync();
    render(jump);
  }

  // ---------- render ----------
  function render(jump) {
    var y = window.scrollY, html, overlay = ui.result || ui.report || ui.decade;
    if (!s || ui.view === 'intro') html = intro();
    else if (ui.view === 'end' && !overlay) html = endView();
    else if (ui.view === 'judge' && !overlay) html = judgeView();
    else {
      var pane = M.pvScope(s, function () { return ({ harita: tabHarita, butce: tabButce, proje: tabProje, bilim: tabBilim, reform: tabReform, diplomasi: tabDip, ordu: tabOrdu, siralama: tabSiralama }[ui.tab] || tabHarita)(); });
      html = header() + '<div class="layout"><div class="main">' + guideBox() + tabs() + pane + '</div>' + side() + '</div>' +
        '<footer class="endbar"><span class="hint">' + (s.focus ? 'Araştırma: ' + esc(M.TECHS[s.focus].n) : 'Araştırma konusu seçilmedi: Divan en ucuz konuya geçecek') + ' · Nizam hedefi ' + s.nizamTarget + ' bin</span>' + btn('end', 'Yılı bitir · ' + s.year + ' →', { cls: 'btn primary' }) + '</footer>';
      if (ui.result) html += resultModal();
      else if (ui.report) html += reportModal();
      else if (ui.decade) html += decadeModal();
      else if (ui.view === 'event') html += eventModal();
      if (ui.why) html += whyModal();
    }
    if (ui.modal === 'code') html += codeModal();
    else if (s && ui.modal === 'brief') html += briefModal();
    else if (s && ui.modal === 'menu') html += menuModal();
    else if (s && ui.modal === 'ocak') html += ocakModal();
    else if (s && ui.modal === 'share') html += shareModal();
    else if (s && ui.modal === 'newgame') html += newGameModal();
    else if (s && ui.modal === 'note') html += modal('Eski kayıt ' + M.VERSION + '\'de', '<p class="etext" id="oldnote">' + esc(ui.note || '') + '</p><p class="note">Kurallar değişti: bazı kararların sonucu farklı çıkmış, bazıları artık geçmiyor olabilir. Yeni olanlar için menüden brifingi açabilirsin.</p>', btn('close', 'Devam', { cls: 'btn primary' }), 'paper');
    if (s && ui.ask) html += askModal();
    if (ui.term) html += termModal();
    var codeEl = document.getElementById('codein'); if (codeEl && ui.modal === 'code') ui.codeIn = codeEl.value;
    app.innerHTML = html;
    document.documentElement.classList.toggle('has-modal', !!app.querySelector('.scrim'));
    if (ui.modal === 'code' && ui.codeIn) { var c2 = document.getElementById('codein'); if (c2) c2.value = ui.codeIn; }
    var el = null;
    if (ui.hl && !app.querySelector('.scrim')) { try { el = app.querySelector(hlSelector(ui.hl)); } catch (e) { el = null; } if (el) { el = el.closest('.card, .stepper, .tech, .rinfo, .seg') || el; el.classList.add('hl'); } }
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    else if (jump && app.querySelector(jump)) app.querySelector(jump).scrollIntoView({ block: jump === '.tabs' || jump.charAt(0) === '#' ? 'start' : 'nearest' });
    else if (ui.view === ui.lastView) window.scrollTo(0, y);
    ui.lastView = ui.view;
    save();
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'term') { e.preventDefault(); e.stopPropagation(); act('term', b.dataset.arg); return; }
    if (b.disabled) return; e.preventDefault(); act(b.dataset.act, b.dataset.arg);
  });
  app.addEventListener('keydown', function (e) { var t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t.classList && (t.classList.contains('term') || t.classList.contains('rg'))) { e.preventDefault(); act(t.dataset.act, t.dataset.arg); } });
  app.addEventListener('input', function (e) { var t = e.target; if (t.dataset && t.dataset.sv && rec) { rec.survey[t.dataset.sv] = t.value; save(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (ui.why || ui.term || (ui.modal && ui.modal !== 'brief'))) { if (ui.term) ui.term = null; else if (ui.why) ui.why = null; else ui.modal = null; render(); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { touch(); save(); } else ui.tick = Date.now(); });

  render();
  flush();
})();
// ==UI END==

</script>
